
name: Build Testriq Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Find Testriq web files
        shell: bash
        run: |
          if [ -f index.html ]; then
            echo "WEB_DIR=." >> "$GITHUB_ENV"
          elif [ -f testriq-release/index.html ]; then
            echo "WEB_DIR=testriq-release" >> "$GITHUB_ENV"
          else
            echo "Could not find index.html"
            exit 1
          fi

      - name: Prepare web app
        run: |
          mkdir -p www
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='www' \
            --exclude='node_modules' \
            "$WEB_DIR/" www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/android@^8 @capacitor-community/text-to-speech@^8.0.2
          npm install --save-dev @capacitor/cli@^8 esbuild

          
      - name: Build Testriq speech bridge
        run: |
          cat > testriq-speech-entry.js <<'EOF'
          import { TextToSpeech } from '@capacitor-community/text-to-speech';

          let currentId = null;
          let stopPromise = Promise.resolve();

          const rangeListenerReady = TextToSpeech.addListener('onRangeStart', (event) => {
            if (currentId !== null) {
              window.testriqSpeechEvent?.(
                currentId,
                'word',
                event.start,
                event.end
              );
            }
          });

          window.TestriqSpeech = {
            async speak(text, id, volume = 1) {
              const requestId = String(id);
              currentId = requestId;

              try {
                await stopPromise;
                await rangeListenerReady;

                if (currentId !== requestId) return;

                window.testriqSpeechEvent?.(requestId, 'start');

                await TextToSpeech.speak({
                  text: String(text),
                  lang: 'en-GB',
                  rate: 0.92,
                  pitch: 1,
                  volume: Math.max(0, Math.min(1, Number(volume) || 0))
                });

                if (currentId === requestId) {
                  window.testriqSpeechEvent?.(requestId, 'end');
                  currentId = null;
                }
              } catch (error) {
                if (currentId === requestId) {
                  window.testriqSpeechEvent?.(requestId, 'error');
                  currentId = null;
                }
              }
            },

            async stop() {
              currentId = null;
              stopPromise = TextToSpeech.stop().catch(() => {});
              await stopPromise;
            }
          };
          EOF

          npx esbuild testriq-speech-entry.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/testriq-speech.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("www/index.html")
          html = path.read_text()
          tag = '<script src="./testriq-speech.js"></script>'

          if tag not in html:
              match = re.search(r"<script\b", html, re.IGNORECASE)
              if match is None:
                  raise RuntimeError("Could not find a script tag in www/index.html")
              html = html[:match.start()] + tag + "\n" + html[match.start():]
              path.write_text(html)

          print("Testriq speech bridge added!")
          PY


      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.symetree.testriq",
            "appName": "Testriq",
            "webDir": "www"
          }
          EOF


 
      - name: Generate Android project and add permissions
        run: |
          npx cap add android
          npx cap sync android


          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")

          if not path.exists():
              raise FileNotFoundError("AndroidManifest.xml was not generated!")

          content = path.read_text()

          required = [
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]

          missing = [p for p in required if p not in content]

          if missing:
              application = re.search(r"<application\b", content)

              if application is None:
                  raise RuntimeError("Could not find application element!")

              permission_tags = "\n".join(
                  f'    <uses-permission android:name="{p}" />'
                  for p in missing
              )

              content = (
                  content[:application.start()]
                  + permission_tags
                  + "\n\n"
                  + content[application.start():]
              )

              path.write_text(content)

          print("Android permissions configured!")
          PY


      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Testriq-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
