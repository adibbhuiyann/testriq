name: Build Testriq Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.js"
      - "android/**"
      - "testriq-full-project.zip"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack zip
        run: |
          if [ -f testriq-full-project.zip ]; then
            unzip -o -q testriq-full-project.zip -x '.github/*'
            echo "UNPACKED=true" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Version
        run: |
          echo "VERSION_NAME=$(grep '^VERSION_NAME=' android/version.properties | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - name: Signing key
        env:
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in android/keystore/upload-keystore.p12.enc -out "$RUNNER_TEMP/upload.p12" -pass env:KEY_PASS
          echo "TESTRIQ_KEYSTORE=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          echo "TESTRIQ_KEYSTORE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon bundleRelease assembleRelease 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Testriq-$VERSION_NAME-$VERSION_CODE.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Testriq-$VERSION_NAME-$VERSION_CODE.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Testriq-app
          path: dist/*

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          name: Testriq ${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})
          files: dist/*

      - name: Save project into repository
        if: env.UNPACKED == 'true'
        run: |
          git config user.name "testriq-ci"
          git config user.email "ci@users.noreply.github.com"
          git rm -q --cached testriq-full-project.zip
          rm -rf dist build.log testriq-full-project.zip
          git add -A
          git commit -q -m "Unpack Testriq project [skip ci]"
          git push

      - name: Save error log
        if: failure()
        run: |
          [ -f build.log ] || echo "No log" > build.log
          git config user.name "testriq-ci"
          git config user.email "ci@users.noreply.github.com"
          tail -n 300 build.log > /tmp/last-build.log
          git checkout --orphan ci-logs
          git rm -rf -q --cached .
          cp /tmp/last-build.log last-build.log
          git add -f last-build.log
          git commit -q -m "Build log"
          git push -f origin ci-logs 
