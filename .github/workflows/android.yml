
name: Build Testriq Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Find Testriq web files
        shell: bash
        run: |
          if [ -f index.html ]; then
            echo "WEB_DIR=." >> "$GITHUB_ENV"
          elif [ -f testriq-release/index.html ]; then
            echo "WEB_DIR=testriq-release" >> "$GITHUB_ENV"
          else
            echo "Could not find index.html"
            exit 1
          fi

      - name: Prepare web app
        run: |
          mkdir -p www
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='www' \
            --exclude='node_modules' \
            "$WEB_DIR/" www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/android@^8
          npm install --save-dev @capacitor/cli@^8

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.symetree.testriq",
            "appName": "Testriq",
            "webDir": "www"
          }
          EOF


 
      - name: Generate Android project and add permissions
        run: |
          npx cap add android
          npx cap sync android

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")

          if not path.exists():
              raise FileNotFoundError(
                  "AndroidManifest.xml was not generated!"
              )

          content = path.read_text()

          permissions = """
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          """

          if "android.permission.CAMERA" not in content:
              content = content.replace(
                  "</manifest>",
                  permissions + "\n</manifest>"
              )

          path.write_text(content)
          print("Camera and microphone permissions added!")
          PY



      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Testriq-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
