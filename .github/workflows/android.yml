
name: Build Testriq Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare web app
        run: |
          mkdir -p www
          cp -r index.html bank.js worker.js sw.js manifest.json icon.svg logo.svg www/

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@^8 @capacitor/android@^8
          npm install --save-dev @capacitor/cli@^8

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.symetree.testriq",
            "appName": "Testriq",
            "webDir": "www"
          }
          EOF

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Testriq-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
