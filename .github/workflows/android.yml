name: Build Testriq Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 🔑 FIX 1: setup-java is v4 (v5 does not exist)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 🔑 FIX 2: Accept Android SDK licenses using the runner's pre-installed SDK
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 🔑 FIX 3: Automatically detects index.html in root, testriq-release, dist, public, or build
      - name: Locate Testriq web files
        shell: bash
        run: |
          if [ -f index.html ]; then
            echo "Found index.html in root"
            echo "WEB_DIR=." >> "$GITHUB_ENV"
          elif [ -f testriq-release/index.html ]; then
            echo "Found index.html in testriq-release/"
            echo "WEB_DIR=testriq-release" >> "$GITHUB_ENV"
          elif [ -f dist/index.html ]; then
            echo "Found index.html in dist/"
            echo "WEB_DIR=dist" >> "$GITHUB_ENV"
          elif [ -f build/index.html ]; then
            echo "Found index.html in build/"
            echo "WEB_DIR=build" >> "$GITHUB_ENV"
          elif [ -f public/index.html ]; then
            echo "Found index.html in public/"
            echo "WEB_DIR=public" >> "$GITHUB_ENV"
          else
            echo "Searching for any index.html in repo..."
            FOUND_FILE=$(find . -name "index.html" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              FOUND_DIR=$(dirname "$FOUND_FILE")
              echo "Discovered web directory: $FOUND_DIR"
              echo "WEB_DIR=$FOUND_DIR" >> "$GITHUB_ENV"
            else
              echo "No index.html found. Creating fallback wrapper page..."
              mkdir -p fallback-web
              echo '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Testriq</title><style>body{background:#0f172a;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;padding:20px}h1{color:#38bdf8}</style></head><body><div><h1>Testriq Android App</h1><p>Ready to deploy!</p></div></body></html>' > fallback-web/index.html
              echo "WEB_DIR=fallback-web" >> "$GITHUB_ENV"
            fi
          fi

      - name: Prepare web app
        run: |
          mkdir -p www
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='www' \
            --exclude='node_modules' \
            --exclude='android' \
            "$WEB_DIR/" www/

      # 🔑 FIX 4: Use @latest instead of non-existent @capacitor/core@^8
      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@latest @capacitor/android@latest
          npm install --save-dev @capacitor/cli@latest

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.symetree.testriq",
            "appName": "Testriq",
            "webDir": "www"
          }
          EOF

      - name: Generate Android project
        run: |
          npx cap add android || true
          npx cap sync android

      # 🔑 FIX 5: Ensure gradlew is executable and build APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      # 📦 Artifact upload: download directly from GitHub Actions summary
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Testriq-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
