,'8','9','11'],answer:2,explanation:'3x = 27, so x = 9.'},{prompt:'An $80 jacket is discounted by 25%. What is the sale price?',options:['$20','$55','$60','$65'],answer:2,explanation:'The discount is $20. $80 − $20 = $60.'},{prompt:'If f(x) = 2x² − 3, what is f(2)?',options:['1','5','8','11'],answer:1,explanation:'2 × 4 − 3 = 5.'},{prompt:'A triangle has angles 48° and 67°. What is the third?',options:['55°','65°','75°'],answer:1,explanation:'180 − 48 − 67 = 65°.'}],sat:[{prompt:'Choose the correct completion: “The range of programmes _____ expanded.”',options:['have','are','has','were'],answer:2,explanation:'“Range” is singular, so use “has”.'},{prompt:'Best transition: “The building was small. _____, it hosted many events.”',options:['Nevertheless','For example','Similarly'],answer:0,explanation:'Nevertheless signals the contrast.'},{prompt:'“Extended beyond” most nearly means:',options:['reached further than','became shorter','was hidden'],answer:0,explanation:'Something extending beyond reaches further than a limit.'}],pte:[{prompt:'What does “remarkable” most nearly mean?',options:['ordinary','notable','temporary'],answer:1,explanation:'Remarkable means notable or worthy of attention.'},{prompt:'Choose the correct sentence.',options:['Conservation depend on research.','Conservation depends on research.','Conservation depending on research.'],answer:1,explanation:'The singular subject takes “depends”.'}]};
const passage='URBAN GREEN SPACES\n\nAs cities become denser, parks and shared gardens are increasingly viewed as essential infrastructure. Trees can reduce surface temperatures, while green corridors support urban wildlife. Accessible parks also offer opportunities for physical activity.\n\nHowever, benefits are not distributed equally. Some districts have more tree cover than others. New green projects can raise nearby property values, sometimes putting pressure on long-term residents. Planners therefore need to consider access, affordability and community participation.';

tarter announcement for focused listening practice.',duration:7,questions:questions.listening,audioText:listeningScript},{id:'pte-speaking-01',exam:'PTE',skill:'Speaking',title:'PTE Academic · Speaking Practice',desc:'Read aloud and discuss a situation with your speaking coach.',duration:12,mode:'speaking',prompt:'Read this aloud, then explain one benefit: Public transport systems can reduce traffic congestion when services are reliable, affordable and connected to residential areas.'},{id:'pte-writing-01',exam:'PTE',skill:'Writing',title:'PTE Academic · Summarise & Write',desc:'Practise a concise academic summary and review your response.',duration:20,mode:'writing',prompt:'Summarise in one sentence (5–75 words):\n\nUrban trees provide shade, absorb some air pollutants and create habitats. Their benefits depend on species selection, maintenance and planting space. City planners need to consider local conditions rather than applying one model everywhere.'}];

function stats(){const rows=state.results.filter(r=>r.mode==='quiz'),total=rows.reduce((n,r)=>n+(r.total||0),0),correct=rows.reduce((n,r)=>n+(r.correct||0),0);const days=new Set(state.results.map(r=>new Date(r.date).toLocaleDateString()));let day=new Date(),streak=0;if(!days.has(day.toLocaleDateString()))day.setDate(day.getDate()-1);while(days.has(day.toLocaleDateString())){streak++;day.setDate(day.getDate()-1)}return {total,correct,accuracy:total?Math.round(correct/total*100)+'%':'—',streak}}
function stat(label,value,sub){return `<div class="stat"><div class="statTop">${label}</div><strong>${value}</strong><small>${sub}</small></div>`}
function home(){const s=stats();return `<div class="hero"><div class="eyebrow">Your preparation workspace</div><h1>Make every practice<br>session count<span style="color:#9ab4ff">.</span></h1><p>Welcome, ${esc(state.nickname||state.name)}. Build skills, understand your mistakes, and prepare with a clear plan for IELTS, SAT and PTE.</p><div class="actions"><button class="btn white" data-nav="tests">Explore practice →</button><button class="btn glass" data-nav="courses">View courses</button></div></div><div class="grid stats">${stat('Practice sessions',state.results.length,'Completed on this device')}${stat('Questions answered',s.total,'Auto-marked questions')}${stat('Average accuracy',s.accuracy,'Sample questions only')}${stat('Study streak',s.streak+(s.streak===1?' day':' days'),'Based on local activity')}</div><div class="sectiontitle"><h2>Choose your exam</h2><button class="textbtn" data-nav="courses">All courses →</button></div><div class="grid examgrid">${courses()}</div><div class="grid twocol"><div class="panel"><div class="testtop"><h3>Meet your speaking companion</h3><span class="pill">2 EXAMINERS</span></div><p>A calm voice, a question at a time. Practise aloud, review your transcript and build confidence with follow-up questions.</p><button class="btn primary small" data-start="ielts-speaking-01">Choose an examiner →</button></div><div class="panel"><h3>Today’s study nudge</h3><div style="font-size:1.6rem">✧</div><b style="font-size:.85rem">Review before you repeat.</b><p>Understanding one mistake can be more useful than rushing through another set.</p><button class="btn ghost small" data-nav="review">Open my results →</button></div></div>`}
function profile(){return heading('Your space','Profile','A familiar face. A name that feels like you.')+`<div class="panel profilehero"><div class="pfpic">${state.photo?`<img src="${esc(state.photo)}" alt="Your profile photo">`:esc((state.name.trim()[0]||'L').toUpperCase())}</div><div><h2 style="margin-bottom:4px">${esc(state.name)}</h2><p>${state.nickname?'Your examiner calls you '+esc(state.nickname):'Add a nickname for your practice sessions.'}</p><div class="actions"><button class="btn primary small" id="choosePhoto">Choose from gallery</button><button class="btn ghost small" id="removePhoto" ${state.photo?'':'disabled'}>Remove photo</button></div><input type="file" id="photoFile" accept="image/*" hidden></div></div><div class="grid settingsgrid" style="margin-top:18px"><form id="profileForm" class="panel"><h3>Your details</h3><label class="field">User name<input id="userName" maxlength="24" required value="${esc(state.name)}" autocomplete="nickname"></label><label class="field">Nickname<input id="nickname" maxlength="16" value="${esc(state.nickname)}" placeholder="What should your examiner call you?"></label><p class="muted">Your profile and photo stay on this browser.</p><button class="btn primary" type="submit">Save profile</button></form><div class="panel"><h3>Make it your own</h3><p>Use a photo from your device. Testriq resizes it for your profile and stores it locally.</p><p>Your nickname appears in greetings from your examiner. It is optional and you can change it anytime.</p><button class="btn ghost small" data-nav="settings">Sound & preferences →</button></div></div>`}
function switchRow(key,title,desc){return `<div class="setting"><div><b>${title}</b><small>${desc}</small></div><button role="switch" aria-checked="${!!state[key]}" aria-label="${title}" class="switch ${state[key]?'on':''}" data-toggle="${key}"></button></div>`}
function settings(){return heading('Make Testriq yours','Settings','A little comfort goes a long way.')+`<div class="grid settingsgrid"><div class="panel"><h3>Appearance & accessibility</h3><div class="setting"><div><b>Theme</b><small>Choose your preferred appearance</small></div><select id="themeSelect" aria-label="Theme"><option value="light" ${state.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option></select></div>${switchRow('motion','Reduce motion','Limit animations, including the opening screen')}${switchRow('large','Larger text','Increase reading size')}<div class="setting"><div><b>Daily goal</b><small>Questions you aim to practise</small></div><select id="goal" aria-label="Daily question goal">${[5,10,15,20,30].map(n=>`<option ${Number(state.goal)===n?'selected':''}>${n}</option>`).join('')}</select></div><p class="muted">Today: ${state.results.filter(r=>r.mode==='quiz'&&new Date(r.date).toLocaleDateString()===new Date().toLocaleDateString()).reduce((n,r)=>n+r.total,0)} / ${state.goal} questions</p></div><div class="panel"><h3>Sound & voice</h3>${switchRow('music','Ambient sound','A gentle synthesized background tone. Pauses during practice and when the app is hidden.')}${switchRow('ticks','Timer sounds','Ticks in the final ten seconds and a completion bell')}${switchRow('voice','Examiner voice','Read listening passages and speaking questions aloud')}<div class="setting"><b>Volume</b><input id="volume" type="range" min="0" max="100" value="${state.volume}" aria-label="Sound volume"></div><button id="testSound" class="btn ghost small">Test timer bell</button></div><div class="panel"><h3>Permissions</h3><p>Manage the access Testriq uses. Your browser makes the final permission decision.</p><div id="permissions"></div><button class="btn ghost small" id="refreshPermissions">Refresh status</button></div><div class="panel"><h3>Speaking AI connection</h3><p>Connect an audio-capable AI service for speaking band estimates, criterion feedback and a personal practice plan. Without it, local reviews and offline follow-ups still work.</p><label class="field">AI endpoint (HTTPS)<input id="aiUrl" type="url" value="${esc(state.aiUrl)}" placeholder="https://your-worker.workers.dev"></label><p class="muted">Follow-ups share submitted transcripts. Audio assessment shares recordings only after you agree in the review screen. Use a trusted endpoint; API keys belong on its server.</p><button class="btn primary small" id="saveAI">Save connection</button><details class="ai-setup"><summary>How to enable audio assessment</summary><ol><li>Deploy the supplied Testriq AI Worker to your Cloudflare account.</li><li>Add your OpenAI API key as the Worker’s OPENAI_API_KEY secret. The service needs access to an audio-capable model.</li><li>Set APP_ORIGIN to this app’s address and keep its rate limiter enabled.</li><li>Paste the deployed HTTPS Worker URL above and save.</li><li>Record a speaking answer, finish the session, then agree to send it and choose Analyze recordings.</li></ol><p>The included AI_SETUP.md has the commands. Never paste an API key into this app.</p></details><p id="aiStatus" class="muted" role="status">${state.aiUrl?'Endpoint configured; connection not yet verified.':'Offline practice mode'}</p></div><div class="panel"><h3>Data & privacy</h3><p>Profile, drafts and results stay in this browser. Browser speech recognition may send audio to its provider. Recordings are saved locally on this device, with playback and download. Data export contains text and settings; download each audio recording separately.</p><div class="actions"><button class="btn ghost small" id="exportData">Export my data</button><button class="btn ghost small" id="resetData">Reset local data</button></div></div><div class="panel"><h3>About Testriq</h3><p>A learning product by SYMETREE.</p><b style="font-size:.82rem">Developer: Md Sajid Shahriar Bhuiyan</b><p style="margin-top:12px">Independent practice platform. Not affiliated with IELTS, College Board or Pearson.</p></div></div>`}
function library(){const rows=visibleTests().filter(t=>(exam==='All'||t.exam===exam)&&(skill==='All'||t.skill===skill));return heading('Practice centre','Practice tests','Short, focused sessions. Make room for progress.','<span class="pill">81 PRACTICE ACTIVITIES</span>')+`<div class="filters">${['All','IELTS','SAT','PTE'].map(e=>`<button class="chip ${exam===e?'active':''}" data-exam="${e}">${e==='All'?'All exams':e}</button>`).join('')}</div><div class="filters">${['All','Reading','Listening','Writing','Speaking','Math','English','Grammar','Overall'].map(s=>`<button class="chip ${skill===s?'active':''}" data-skill="${s}">${s==='All'?'All skills':s}</button>`).join('')}</div><div class="grid testgrid">${rows.length?rows.map(t=>`<article class="testcard"><div class="testtop"><span class="tag">${t.exam} · ${t.skill}</span><span class="pill">${t.mode==='overall'?'4 SKILLS':t.skill==='Overall'?'COMBINED':'PRACTICE'}</span></div><h3>${t.title}</h3><p>${t.desc}</p><div class="testmeta">◷ ${t.duration} min &nbsp; · &nbsp; ${t.questions?t.questions.length+' questions':t.mode==='speaking'?'Voice recording':t.mode==='overall'?'4 skill sections':'Self-review'}</div><button class="btn primary" data-start="${t.id}">${state.drafts[t.id]?'Resume practice':'Start practice'} →</button></article>`).join(''):'<div class="empty">No sets match. Try a different exam or skill.</div>'}</div>`}
function results(){return heading('Learn from every attempt','My results','Your practice history, saved on this device.')+(state.results.length?state.results.map((r,i)=>`<article class="panel" style="margin-bottom:12px"><div class="testtop"><div><span class="tag">${esc(r.exam)} · ${esc(r.skill)}</span><h3 style="margin:6px 0">${esc(r.title)}</h3><small class="muted">${new Date(r.date).toLocaleString()}</small></div><span class="pill">${r.mode==='quiz'?r.correct+'/'+r.total+' correct':r.assessment?.overall!=null?'Speaking estimate '+r.assessment.overall.toFixed(1):r.skill==='Speaking'?'Speaking review':'Self-review'}</span></div>${r.mode==='quiz'?`<div class="progress"><span style="width:${r.percent}%"></span></div>`:'<p>No official score is generated for this practice.</p>'}<button class="btn ghost small" data-result="${i}">View review →</button></article>`).join(''):'<div class="empty">Your completed practice sessions will appear here.</div>')}
function progress(){const s=stats(),rows=state.results.filter(r=>r.mode==='quiz');return heading('Your learning signals','Progress','Choose what to practise next.')+`<div class="grid stats">${tracks.map(t=>stat(t.exam+' sessions',state.results.filter(r=>r.exam===t.exam).length,'Completed activities')).join('')}${stat('Best accuracy',rows.length?Math.max(...rows.map(r=>r.percent))+'%':'—','Auto-marked samples')}</div><div class="panel"><h3>Skill overview</h3>${['Reading','Listening','Writing','Speaking','Math','Grammar'].map(skill=>{const rs=rows.filter(r=>r.skill===skill),n=rs.reduce((a,r)=>a+r.total,0),c=rs.reduce((a,r)=>a+r.correct,0);return `<div class="setting"><b>${skill}</b><small>${n?Math.round(c/n*100)+'% · '+n+' questions':state.results.some(r=>r.skill===skill)?'Self-review activities completed':'Not attempted'}</small></div>`}).join('')}</div><div class="panel" style="margin-top:16px"><h3>Understanding these scores</h3><p>Accuracy measures sample questions only. It is not an official IELTS band, SAT scaled score or PTE score. Writing is self-reviewed. Connected audio AI can provide an estimated IELTS speaking band, with criterion feedback and uncertainty. Estimates are not validated predictions or official exam scores.</p></div>`}
function render(){const views={home,courses:()=>heading('Learning paths','Courses','Structured practice by exam and skill.')+`<div class="grid examgrid">${courses()}</div><div class="panel" style="margin-top:18px"><h3>A growing practice library</h3><p>Choose from 81 activities, including 10 IELTS four-skill sets and 10 combined SAT sets. Combined IELTS sets use the linked skill activities. These are compact practice sets, not full-length official mocks. Listening uses browser-generated speech.</p></div>`,tests:library,review:results,progress,profile,settings,help:()=>heading('A few useful details','Help & about','Make yourself at home.')+`<div class="panel"><h3>Your first session</h3><p>Choose an exam, open an activity, and work through it at your own pace. Quiz answers and writing drafts save as you go. Close a session and reopen the same set to resume.</p><h3>Voice practice</h3><p>Adib uses browser text-to-speech. Press “Hear question” or “Play passage” to start. Record answer captures audio for local playback and download over HTTPS. Speech-to-text is an optional separate feature; you can always type a transcript. Stop recording before submitting an answer.</p><h3>Sound & permissions</h3><p>Ambient audio needs a tap to begin. It pauses during tests and when the app is hidden. The gallery uses your device’s file picker. Microphone and notification access can be requested individually in Settings; denied permissions can be changed in browser settings.</p><h3>AI and scoring</h3><p>Offline follow-ups use templates based on words in your answer. Connecting an AI endpoint enables model-generated follow-ups. Feedback is for practice, not an official score. No API key is embedded in this app.</p><h3>Install & offline</h3><p>When served over HTTPS, supported browsers offer Install app or Add to Home Screen. Open once online to cache the app. Speech recognition and connected AI can still require internet.</p><h3>About</h3><p>TESTRIQ · BY SYMETREE<br>Designed and developed by Md Sajid Shahriar Bhuiyan.</p></div>`};$('#main').innerHTML=(views[page]||home)()+`<footer>TESTRIQ · A SYMETREE learning product<br>Designed and developed by Md Sajid Shahriar Bhuiyan</footer>`;$('#desktopNav').innerHTML=navItems.map(navButton).join('');$('#mobileNav').innerHTML=navItems.filter(n=>['home','tests','review','profile','settings'].includes(n[0])).map(navButton).join('');bindPage();if(page==='settings')renderPermissions()}
function bindPage(){if(page==='profile'){ $('#choosePhoto').onclick=()=>$('#photoFile').click();$('#photoFile').onchange=pickPhoto;$('#removePhoto').onclick=()=>{state.photo='';save();apply();render()};$('#profileForm').onsubmit=e=>{e.preventDefault();const name=$('#userName').value.trim();if(!name)return notify('Enter a user name.');state.name=name;state.nickname=$('#nickname').value.trim();save();apply();render();notify('Profile saved.')};}if(page==='settings'){ $('#themeSelect').onchange=e=>{state.theme=e.target.value;save();apply()};$('#goal').onchange=e=>{state.goal=Number(e.target.value);save();render()};$('#volume').oninput=e=>{state.volume=Number(e.target.value);save();updateAudio()};$('#testSound').onclick=()=>bell();$('#refreshPermissions').onclick=renderPermissions;$('#saveAI').onclick=()=>{const value=$('#aiUrl').value.trim();try{if(value){const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password)throw Error();}state.aiUrl=value;save();$('#aiStatus').textContent=value?'Endpoint configured. It will be checked on your next speaking response.':'Offline practice mode';notify('AI connection saved.')}catch{notify('Enter a valid HTTPS endpoint without credentials.')}};$('#exportData').onclick=exportData;$('#resetData').onclick=()=>{if(confirm('Delete this browser’s Testriq profile, drafts and results?')){state={...defaults,results:[],drafts:{}};localStorage.removeItem('testriq_v1');clipStore('clear').catch(()=>notify('Audio storage could not be cleared. Clear site data in browser settings.'));save();apply();render();notify('Local data reset.')}}}}
async function pickPhoto(e){const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return notify('Choose an image file.');if(file.size>15*1024*1024)return notify('Choose an image smaller than 15 MB.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=canvas.height=320;const ctx=canvas.getContext('2d'),side=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,320,320);const previous=state.photo;state.photo=canvas.toDataURL('image/jpeg',.85);if(!save())state.photo=previous;apply();render()}catch{notify('This image could not be opened. Try a JPEG or PNG.')}finally{URL.revokeObjectURL(url)}}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='testriq-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
let audioCtx=null,musicGain=null,oscillators=[];
function audio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx){audioCtx=new AC();musicGain=audioCtx.createGain();musicGain.gain.value=0;musicGain.connect(audioCtx.destination);[130.81,196,261.63].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=i===0?.15:.07;o.connect(g);g.connect(musicGain);o.start();oscillators.push(o)})}audioCtx.resume().catch(()=>{});return audioCtx}
function updateAudio(){if(!audioCtx)return;musicGain.gain.setTargetAtTime(state.music&&!active&&!document.hidden?state.volume/100*.25:0,audioCtx.currentTime,.3)}
function tone(freq,duration,level=.2){const ctx=audio();if(!ctx||!state.volume||document.hidden)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(Math.max(.0001,level*state.volume/100),ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration)}function bell(){tone(660,.6);setTimeout(()=>tone(880,.8),160)}
function speak(text){if(recordingBusy())return notify('Stop your recording before playing Adib’s voice.');stopRecognition();if(!state.voice)return notify('Enable examiner voice in Settings.');if(!('speechSynthesis'in window))return notify('Voice playback is unavailable in this browser.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.92;u.volume=state.volume/100;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))notify('Voice playback failed. The text is available on screen.')};speechSynthesis.speak(u)}
function stopRecognition(){if(recognition){const r=recognition;recognition=null;r.onresult=null;r.onend=null;r.onerror=null;try{r.abort()}catch{}}}
async function permissionState(name){try{return (await navigator.permissions.query({name})).state}catch{return 'Check in browser'}}
async function renderPermissions(){const target=$('#permissions');if(!target)return;const mic=navigator.mediaDevices?.getUserMedia?await permissionState('microphone'):'Unavailable',notification='Notification'in window?Notification.permission:'Unavailable';if(!target.isConnected)return;target.innerHTML=`<div class="setting"><div><b>Microphone</b><small>${esc(mic)} · voice recording and optional transcription</small></div><button class="btn ghost small" id="allowMic">Request</button></div><div class="setting"><div><b>Photo library</b><small>Select a single image through your device’s picker</small></div><button class="btn ghost small" data-nav="profile">Choose</button></div><div class="setting"><div><b>Notifications</b><small>${esc(notification)} · test notification while open</small></div><button class="btn ghost small" id="allowNotifications">Request</button></div><div class="setting"><div><b>Local storage</b><small>Used for your profile, results and drafts</small></div><span class="pill">LOCAL</span></div>`;$('#allowMic').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone needs HTTPS and a supported browser.');const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());notify('Microphone permission granted.');renderPermissions()}catch(e){notify(e.name==='NotAllowedError'?'Microphone access denied. Change access in browser settings.':e.message)}};$('#allowNotifications').onclick=async()=>{try{if(!('Notification'in window))throw Error('Notifications are unavailable in this browser.');const p=await Notification.requestPermission();if(p==='granted'){try{new Notification('Testriq',{body:'You’re ready for a focused practice session.'})}catch{notify('Notifications permitted; this browser requires an installed app to display them.')}}else notify('Notifications were not enabled.');renderPermissions()}catch(e){notify(e.message)}}}
function fmt(s){return Math.floor(Math.max(0,s)/60).toString().padStart(2,'0')+':'+(Math.max(0,s)%60).toString().padStart(2,'0')}
function openPractice(title){returnFocus=document.activeElement;$('#dialogTitle').textContent=title;if(!$('#practice').open)$('#practice').showModal();updateAudio()}
function cleanup(){assessmentRequest?.abort();assessmentRequest=null;stopRecording();releaseAudioURLs();clearInterval(clock);clock=null;request?.abort();request=null;stopRecognition();if('speechSynthesis'in window)speechSynthesis.cancel();active=null;updateAudio()}
function closePractice(){draft();cleanup();$('#practice').close();render();if(returnFocus?.isConnected)returnFocus.focus();else $('#main').focus()}
function draft(){if(!active||active.completed)return;const {test,answers,index,seconds,response,turns,checks,clips,plannedIndex,examinerId}=active;state.drafts[test.id]={answers,index,seconds,response,turns,checks,clips,plannedIndex,examinerId};save()}
function start(id,bundle=null){const test=tests.find(t=>t.id===id);if(!test)return;if(test.mode==='overall')return startOverall(test);cleanup();const d=state.drafts[id]||{};const selectedExaminer=examinerFor(d.examinerId||state.examinerId).id;active={test,examinerId:selectedExaminer,index:d.index||0,answers:d.answers||{},seconds:d.seconds??test.duration*60,response:d.response||'',turns:d.turns||[{role:'assistant',content:test.prompt||'',examinerId:selectedExaminer}],checks:d.checks||[],clips:d.clips||[],plannedIndex:d.plannedIndex||0,bundle,checked:false,completed:false,busy:false};active.index=Math.min(active.index,(test.questions?.length||1)-1);openPractice(test.title);showActive();clock=setInterval(()=>{if(!active||active.completed)return;active.seconds=Math.max(0,active.seconds-1);const timer=$('#timer');if(timer)timer.textContent=fmt(active.seconds);if(state.ticks&&active.seconds>0&&active.seconds<=10)tone(1000,.04,.08);if(active.seconds===0){clearInterval(clock);if(state.ticks)bell();if(test.questions)finishQuiz(true);else notify('Suggested practice time is up. You can continue or finish.')}draft()},1000)}
function topbar(){return `<div class="testtop"><span class="pill">${active.test.exam} · ${active.test.skill}</span><span class="timer" id="timer">${fmt(active.seconds)}</span></div>`}
function showActive(){if(active.test.mode==='speaking')showSpeaking();else if(active.test.mode==='writing')showWriting();else showQuestion()}
function showQuestion(){const a=active,t=a.test,q=t.questions[a.index];$('#modalBody').innerHTML=topbar()+`<div class="progress"><span style="width:${(a.index+1)/t.questions.length*100}%"></span></div><p class="muted">Question ${a.index+1} of ${t.questions.length}</p>${(q.passage||t.passage)?`<div class="passage">${esc(q.passage||t.passage)}</div>`:''}${q.section?`<span class="pill">${esc(q.section)}</span>`:''}${t.audioText?`<div class="panel"><b style="font-size:.85rem">Listening with Adib</b><p>Browser-generated voice · sample script</p><div class="actions"><button class="btn ghost small" id="playPassage">▶ Play passage</button><button class="btn ghost small" id="stopVoice">Stop</button></div><details style="margin-top:12px"><summary class="muted">Show transcript</summary><p>${esc(t.audioText)}</p></details></div>`:''}<div class="question">${esc(q.prompt)}</div><div class="options">${q.options.map((o,i)=>`<button class="option ${a.answers[a.index]===i?'selected':''}" data-opt="${i}" aria-pressed="${a.answers[a.index]===i}">${String.fromCharCode(65+i)} &nbsp; ${esc(o)}</button>`).join('')}</div>${a.checked?`<div class="explain"><b>${a.answers[a.index]===q.answer?'Correct':'Let’s review'}</b><p style="margin:5px 0 0">${esc(q.explanation)}</p></div>`:''}<div class="qfoot"><button class="btn ghost" id="previous" ${a.index===0?'disabled':''}>← Back</button><button class="btn primary" id="next">${a.checked?(a.index===t.questions.length-1?'Finish session':'Next question →'):'Check answer →'}</button></div><p class="muted" style="margin-top:16px">Your answers are saved on this device.</p>`;$$('[data-opt]').forEach(b=>b.onclick=()=>{a.answers[a.index]=Number(b.dataset.opt);a.checked=false;draft();showQuestion()});$('#previous').onclick=()=>{a.index--;a.checked=false;draft();showQuestion()};$('#next').onclick=()=>{if(a.answers[a.index]===undefined)return notify('Choose an answer first.');if(!a.checked){a.checked=true;showQuestion()}else if(a.index<t.questions.length-1){a.index++;a.checked=false;draft();showQuestion()}else finishQuiz(false)};if(t.audioText){$('#playPassage').onclick=()=>speak(t.audioText);$('#stopVoice').onclick=()=>speechSynthesis.cancel()}}
function addResult(r){r.clips=active.clips||[];if(r.skill==='Speaking')r.examinerId=active.examinerId;state.results.unshift({...r,id:Date.now(),date:new Date().toISOString()});if(active.bundle){const b=active.bundle;const progress=state.drafts[b.id]||{done:{}};progress.done[active.test.id]=state.results[0].id;state.drafts[b.id]=progress;}delete state.drafts[active.test.id];active.completed=true;save();clearInterval(clock);stopRecognition();if('speechSynthesis'in window)speechSynthesis.cancel()}
function finishQuiz(timeout){if(!active||active.completed)return;const a=active,t=a.test,correct=t.questions.reduce((n,q,i)=>n+(a.answers[i]===q.answer),0),r={exam:t.exam,skill:t.skill,title:t.title,mode:'quiz',questions:t.questions,answers:{...a.answers},correct,total:t.questions.length,percent:Math.round(correct/t.questions.length*100),timeout};addResult(r);showReview(state.results[0])}
function showWriting(){const a=active;$('#modalBody').innerHTML=topbar()+`<div class="passage">${esc(a.test.prompt)}</div><label class="field" for="writingText">Your response</label><textarea id="writingText" placeholder="Write your response here…">${esc(a.response)}</textarea><div class="muted" id="wordCount"></div><div class="panel" style="margin-top:18px"><h3>Self-review checklist</h3>${['I addressed the task and stated a clear position.','I organised ideas logically with support.','I checked vocabulary, grammar and punctuation.','I checked the suggested word limit.'].map((r,i)=>`<label style="display:block;font-size:.8rem;margin:12px 0"><input type="checkbox" data-check="${i}" ${a.checks.includes(i)?'checked':''}> ${r}</label>`).join('')}</div><div class="qfoot"><button class="btn ghost" id="saveWriting">Save draft</button><button class="btn primary" id="finishWriting">Finish & save review</button></div>`;function count(){$('#wordCount').textContent=(a.response.trim()?a.response.trim().split(/\s+/).length:0)+' words · saved locally'}count();$('#writingText').oninput=e=>{a.response=e.target.value;draft();count()};$$('[data-check]').forEach(b=>b.onchange=()=>{a.checks=$$('[data-check]:checked').map(b=>Number(b.dataset.check));draft()});$('#saveWriting').onclick=()=>{draft();notify('Draft saved.')};$('#finishWriting').onclick=()=>{if(!a.response.trim())return notify('Write a response before finishing.');addResult({exam:a.test.exam,skill:'Writing',title:a.test.title,mode:'self',response:a.response,checked:a.checks.length});showReview(state.results[0])}}
function offlineFollowup(answer,turn){const words=answer.toLowerCase();if(turn>=5)return 'Thinking about everything we discussed, what would you like to improve in the future, and why?';if(/study|student|university|school|learn/.test(words))return 'You mentioned learning. Can you describe a specific challenge in your studies and explain how you handled it?';if(/work|job|office|career/.test(words))return 'You mentioned work. What part of your work would you change, and how would that improve your daily life?';if(/travel|place|city|visit/.test(words))return 'What makes that place meaningful to you? Can you describe a particular experience there?';if(/family|friend|people/.test(words))return 'How have those people influenced your choices? Please give a specific example.';return ['Could you give a specific example of what you mean, and explain why it matters to you?','How has your view on this changed over time?','What might someone with a different view say about that?','What are the advantages and challenges of the approach you described?'][turn%4]}
function showSpeaking(){const a=active,last=a.turns.at(-1);releaseAudioURLs();$('#modalBody').innerHTML=topbar()+examinerPicker(a)+`<div class="coach"><div class="brandmark">${examinerFor(a.examinerId).initials}</div><div><b>${examinerFor(a.examinerId).name} · Your speaking examiner</b><span class="muted">${state.aiUrl?'Connected AI · checked when you submit':'Offline · answer-based question templates'}</span></div></div><div class="passage"><span class="tag">Question ${a.turns.filter(t=>t.role==='assistant').length}</span><div class="question" style="color:var(--ink)">${esc(last.content)}</div><div class="actions"><button class="btn ghost small" id="hearQuestion">▶ Hear question</button><button class="btn ghost small" id="stopVoice">Stop voice</button></div></div>${recordingPanel()}<label class="field" for="transcript">Your answer transcript</label><p class="muted">Speak or type. Check the transcript before submitting. Browser recognition may use an online service; voice recordings stay on this device.</p><textarea id="transcript" placeholder="Your answer will appear here…">${esc(a.response)}</textarea><div class="status" id="micStatus" role="status">Ready when you are, ${esc(state.nickname||state.name)}.</div><div class="actions"><button class="btn primary" id="micBtn">Start speech-to-text</button><button class="btn ghost" id="stopMic">Stop speech-to-text</button></div>${a.test.prompts?`<button class="btn ghost small" id="nextPart" style="margin-top:15px" ${a.plannedIndex>=a.test.prompts.length-1?'disabled':''}>Next interview part →</button>`:''}<div class="qfoot"><button class="btn ghost" id="finishSpeaking">Finish & review</button><button class="btn primary" id="followup" ${a.busy?'disabled':''}>${a.busy?examinerFor(a.examinerId).name+' is thinking…':'Submit & ask follow-up →'}</button></div><p class="muted" style="margin-top:15px">Finish to see your review and improvement plan. Connected audio AI can estimate an IELTS speaking band; it is not an official score.</p><details><summary class="muted">Conversation so far</summary>${a.turns.slice(0,-1).map(t=>`<div class="reviewitem"><b>${t.role==='user'?'You':examinerFor(t.examinerId||a.examinerId).name}</b><p>${esc(t.content)}</p></div>`).join('')}</details>`;bindRecording();bindExaminerPicker(a);if($('#nextPart'))$('#nextPart').onclick=()=>{if(recordingBusy()||recognition||a.busy)return notify('Stop recording or transcription before changing parts.');if(a.plannedIndex>=a.test.prompts.length-1)return;if(a.response.trim()){a.turns.push({role:'user',content:a.response.trim()});a.response='';}else if(!a.clips.some(c=>c.turn===a.turns.filter(t=>t.role==='assistant').length))return notify('Record or type an answer before moving on.');a.plannedIndex++;const p=a.test.prompts[a.plannedIndex];a.turns.push({role:'assistant',content:p.part+' — '+p.text,examinerId:a.examinerId});draft();showSpeaking();if(state.voice)speak(p.text)};$('#transcript').oninput=e=>{a.response=e.target.value;draft()};$('#hearQuestion').onclick=()=>speak(last.content);$('#stopVoice').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel()};$('#micBtn').onclick=startMicrophone;$('#stopMic').onclick=()=>{if(recognition){recognition.stop();$('#micStatus').textContent='Finishing transcription…'}};$('#followup').onclick=askFollowup;$('#finishSpeaking').onclick=()=>{if(a.busy)return notify('Wait for your examiner or close the session to cancel.');if(recordingBusy()||recognition)return notify('Stop recording and speech-to-text before saving.');const turns=[...a.turns];if(a.response.trim())turns.push({role:'user',content:a.response.trim()});if(!turns.some(t=>t.role==='user')&&!a.clips.length)return notify('Record or type an answer before finishing.');addResult({exam:a.test.exam,skill:'Speaking',title:a.test.title,mode:'self',turns,response:'',feedback:'Review whether you answered each question, supported ideas with examples and used clear language. Replay your recording alongside the feedback. Local observations use your saved transcript; only connected audio AI can assess pronunciation.'});showReview(state.results[0])};if(!(window.SpeechRecognition||window.webkitSpeechRecognition)){$('#micBtn').disabled=true;$('#micStatus').textContent='Speech recognition unavailable in this browser. Type your answer instead.'}}
function startMicrophone(){if(!active||active.busy)return;if(recordingBusy())return notify('Stop audio recording before starting speech-to-text.');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;stopRecognition();if('speechSynthesis'in window)speechSynthesis.cancel();const a=active,r=new SR(),base=a.response.trim();recognition=r;r.lang='en-GB';r.continuous=true;r.interimResults=true;let final='';r.onstart=()=>{if($('#micStatus'))$('#micStatus').textContent='Listening… Speak naturally, then press Stop microphone.'};r.onresult=e=>{if(active!==a)return;let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript}a.response=[base,final,interim].filter(Boolean).join(' ').trim();if($('#transcript'))$('#transcript').value=a.response;draft()};r.onerror=e=>{if($('#micStatus'))$('#micStatus').textContent=e.error==='not-allowed'?'Microphone denied. Enable it in browser settings or type your answer.':'Transcription stopped: '+e.error+'. You can type your answer.'};r.onend=()=>{if(recognition===r)recognition=null;if($('#micStatus')&&!$('#micStatus').textContent.includes('denied'))$('#micStatus').textContent='Microphone stopped. Review your transcript before submitting.'};try{r.start()}catch{recognition=null;notify('Microphone could not start. Try typing instead.')}}
async function askFollowup(){const a=active;if(!a||a.busy)return;if(recordingBusy()||recognition)return notify('Stop recording and review your transcript first.');const response=a.response.trim();if(!response)return notify('Speak or type an answer first.');if(a.turns.filter(t=>t.role==='user').length>=7)return notify('You’ve completed eight questions. Finish and review this session.');a.busy=true;const turns=[...a.turns,{role:'user',content:response}];let question,source='offline';showSpeaking();if(state.aiUrl){const controller=new AbortController();request=controller;const timeout=setTimeout(()=>controller.abort(),20000);try{const res=await fetch(state.aiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'followup',exam:a.test.exam,examinerId:a.examinerId,nickname:state.nickname||state.name,messages:turns}),signal:controller.signal,credentials:'omit'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(typeof data.question!=='string'||!data.question.trim()||data.question.length>1500)throw Error('Invalid question response');question=data.question.trim();source='ai'}catch{if(active===a)notify('AI unavailable. Your examiner is using an offline follow-up.')}finally{clearTimeout(timeout);if(request===controller)request=null}}if(active!==a)return;if(!question)question=offlineFollowup(response,turns.filter(t=>t.role==='user').length);a.turns=[...turns,{role:'assistant',content:question,source,examinerId:a.examinerId}];a.response='';a.busy=false;draft();showSpeaking();if(state.voice)speak(question)}
function showReview(r){$('#dialogTitle').textContent='Session review';releaseAudioURLs();$('#modalBody').innerHTML=`<div class="testtop"><span class="pill">${esc(r.exam)} · ${esc(r.skill)}</span><span class="muted">${r.mode==='quiz'?'Practice accuracy':r.skill==='Speaking'?'Speaking feedback':'Self-review'}</span></div><h2>${esc(r.title)}</h2>${r.mode==='quiz'?`<div class="resultScore">${r.percent}%</div><p class="muted">${r.correct} of ${r.total} correct.${r.timeout?' The timer reached zero.':''} Sample practice only.</p>${(r.questions||[]).map((q,i)=>`<div class="reviewitem"><b>${i+1}. ${esc(q.prompt)}</b><p>Your answer: ${esc(q.options[r.answers[i]]??'Not answered')}<br>Correct: ${esc(q.options[q.answer])}</p><p>${esc(q.explanation)}</p></div>`).join('')}`:r.turns?`<p class="muted">${esc(r.feedback)}</p>${r.turns.map(t=>`<div class="reviewitem"><b>${t.role==='user'?'You':examinerFor(t.examinerId||r.examinerId).name}${t.source==='offline'?' · offline template':t.source==='ai'?' · connected AI':''}</b><p>${esc(t.content)}</p></div>`).join('')}`:`<div class="passage">${esc(r.response||'No response saved.')}</div>${r.mode==='overall'?'':`<p class="muted">${r.checked||0} self-review criteria checked. No automatic grade.</p>`}`}<button class="btn primary" id="reviewDone" style="margin-top:20px">Done</button>`;if(r.skill==='Speaking')mountSpeakingReview(r);if(r.sections?.length){const sectionLinks=document.createElement('div');$('#modalBody').insertBefore(sectionLinks,$('#reviewDone'));r.sections.forEach(id=>{const child=state.results.find(x=>x.id===id);if(!child)return;const b=document.createElement('button');b.className='btn ghost small';b.style.margin='5px';b.textContent='Review '+child.skill;b.onclick=()=>{showReview(child);$('#reviewDone').textContent='Back to overall review';$('#reviewDone').onclick=()=>showReview(r)};sectionLinks.append(b)})}if(r.clips?.length){const recordings=document.createElement('div');recordings.className='panel';$('#modalBody').insertBefore(recordings,$('#reviewDone'));showClips(r.clips,recordings)}$('#reviewDone').textContent=active?.bundle?'Continue overall test →':'Done';$('#reviewDone').onclick=active?.bundle?()=>startOverall(active.bundle):closePractice;$('#practice').scrollTop=0}
// Delegated navigation also works inside dynamically rendered permission panels.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)navigate(b.dataset.nav);if(b.dataset.course){exam=b.dataset.course;skill='All';navigate('tests')}if(b.dataset.exam){exam=b.dataset.exam;render()}if(b.dataset.skill){skill=b.dataset.skill;render()}if(b.dataset.start)start(b.dataset.start);if(b.dataset.result!==undefined){openPractice('Review');showReview(state.results[Number(b.dataset.result)])}if(b.dataset.toggle){const key=b.dataset.toggle;state[key]=!state[key];if(key==='music')audio();save();apply();render()}});
$('#closeModal').onclick=closePractice;$('#practice').addEventListener('cancel',e=>{e.preventDefault();closePractice()});$('#themeQuick').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';save();apply();if(page==='settings')render()};$('#soundQuick').onclick=()=>{audio();state.music=!state.music;save();apply();if(page==='settings')render()};document.addEventListener('pointerdown',()=>{if(state.music)audio()},{once:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){stopRecording();stopRecognition();if('speechSynthesis'in window)speechSynthesis.cancel();draft()}updateAudio()});window.addEventListener('pagehide',()=>{draft();cleanup()});apply();render();

function startOverall(test){
 draft();cleanup();
 const progress=state.drafts[test.id]||{done:{}};if(!progress.done)progress.done={};state.drafts[test.id]=progress;save();
 active={test,completed:true};openPractice(test.title);
 const done=Object.keys(progress.done).length;
 $('#modalBody').innerHTML=`<span class="pill">IELTS · Four-skill practice</span><h2 style="margin-top:15px">${esc(test.title)}</h2><p class="muted">Complete the linked Listening, Reading, Writing and Speaking activities. Progress saves after each section. These compact activities are not a full-length official IELTS mock.</p><div class="progress"><span style="width:${done/4*100}%"></span></div><p class="muted">${done} of 4 sections completed</p>${test.modules.map((id,index)=>{const t=tests.find(t=>t.id===id);return `<div class="panel overall-module"><div class="testtop"><div><span class="tag">Section ${index+1} · ${t.skill}</span><h3 style="margin:7px 0">${esc(t.title)}</h3></div><span class="pill">${progress.done[id]?'COMPLETE':t.duration+' MIN'}</span></div><button class="btn ${progress.done[id]?'ghost':'primary'} small" data-module="${id}">${progress.done[id]?'Practise again':state.drafts[id]?'Resume section':'Start section'} →</button></div>`}).join('')}<div class="qfoot"><button class="btn ghost" id="overallClose">Save & close</button><button class="btn primary" id="overallFinish" ${done<4?'disabled':''}>Finish overall test</button></div>`;
 $$('[data-module]').forEach(b=>b.onclick=()=>start(b.dataset.module,test));$('#overallClose').onclick=closePractice;
 $('#overallFinish').onclick=()=>{if(test.modules.some(id=>!progress.done[id]))return;const sections=test.modules.map(id=>state.results.find(r=>r.id===progress.done[id])).filter(Boolean);const r={id:Date.now(),date:new Date().toISOString(),exam:'IELTS',skill:'Overall',title:test.title,mode:'overall',sections:sections.map(r=>r.id),response:sections.map(r=>r.skill+': '+r.title+'\n'+(r.mode==='quiz'?r.correct+'/'+r.total+' correct ('+r.percent+'%)':'Completed · self-review')).join('\n\n')+'\n\nListening and Reading accuracy is for these compact practice questions only. Writing and Speaking are self-reviewed; no official overall band is calculated.'};state.results.unshift(r);delete state.drafts[test.id];save();showReview(r)};
}
