 PTE:[
  S('speaking','Speaking','🎙️','Read aloud, repeat sentence, retell lecture, short answers and respond to a situation.',t=>t.skill==='Speaking',{real:'Part 1 of the real test combines Speaking & Writing'}),
  S('writing','Writing','✍️','Summarize Written Text and Write Essay, scored out of 90.',t=>t.skill==='Writing',{real:'Summarize Written Text: 10 minutes · Essay: 20 minutes',groups:[['Summarize Written Text',t=>t.task==='pte-swt'],['Write Essay',t=>t.task==='pte-essay']]}),
  S('reading','Reading','📖','Multiple choice, fill in the blanks and reorder paragraphs.',t=>t.skill==='Reading',{real:'Part 2 of the real test: about 30 minutes'}),
  S('listening','Listening','🎧','Summaries, missing words and detail questions from short lectures.',t=>t.skill==='Listening',{real:'Part 3 of the real test: about 30–40 minutes'}),
  S('mock','Mock Tests','🏁','Speaking & Writing, Reading and Listening in the official order.',t=>t.skill==='Overall',{wide:true,real:'Real test: about 2 hours 15 minutes · 3 parts'})]};
window.TQSECTIONS=SECTIONS;
const COURSE_INFO={IELTS:{name:'IELTS Academic',desc:'Listening, Reading, Writing and Speaking — with band estimates out of 9.'},SAT:{name:'Digital SAT',desc:'Math and Reading & Writing, timed at real exam pace.'},PTE:{name:'PTE Academic',desc:'Speaking, Writing, Reading and Listening — scored out of 90.'}};
tracks.forEach(t=>{const i=COURSE_INFO[t.exam];if(i){t.title=i.name;t.desc=i.desc}});

/* ---------- Completion ---------- */
let cacheKey='',doneIds=new Set();
function refresh(){const k=state.results.length+':'+(state.results[0]?.id||0);if(k===cacheKey)return;cacheKey=k;doneIds=new Set();const byTitle={};tests.forEach(t=>{byTitle[t.exam+'|'+t.title]=t.id;if(t.legacyTitle)byTitle[t.exam+'|'+t.legacyTitle]=t.id});
 for(const r of state.results){if(r.testId&&tests.some(t=>t.id===r.testId))doneIds.add(r.testId);else{const id=byTitle[r.exam+'|'+r.title];if(id)doneIds.add(id)}}}
const isDone=t=>{refresh();return doneIds.has(t.id)};
window.tqIsDone=isDone;
const resultsFor=t=>state.results.filter(r=>r.testId===t.id||r.exam===t.exam&&(r.title===t.title||t.legacyTitle&&r.title===t.legacyTitle));
function bestLabel(t){const rs=resultsFor(t);if(!rs.length)return '';const ests=rs.map(r=>tqEstimate(r)).filter(Boolean);if(!ests.length)return 'Completed';const b=ests.reduce((m,e)=>e.num>m.num?e:m);return b.label==='Accuracy'?'Best '+b.value:b.label.replace('≈ ','')+' '+b.value}
const secTests=(exam,sec)=>visibleTests().filter(t=>t.exam===exam&&sec.f(t));
window.tqSectionOf=t=>{const sec=(SECTIONS[t.exam]||[]).find(s=>s.f(t));return sec?secTests(t.exam,sec):null};
const courseTests=exam=>visibleTests().filter(t=>t.exam===exam);
const coursePct=exam=>{const all=courseTests(exam),d=all.filter(isDone).length;return {d,n:all.length,p:all.length?Math.round(d/all.length*100):0}};
window.courseDone=exam=>{const c=coursePct(exam);return c.n>0&&c.d===c.n};
window.courseSummary=exam=>{const c=coursePct(exam);return c.d+' of '+c.n+' completed'};
const inProgress=t=>{const d=state.drafts[t.id];if(!d||isDone(t)||t.mode==='speaking')return false;if(t.mode==='overall')return Object.keys(d.done||{}).length>0;return Object.keys(d.answers||{}).length>0||(d.response||'').trim().length>0||(d.index||0)>0||(d.turns||[]).length>1};
const nextIn=list=>list.find(t=>inProgress(t))||list.find(t=>!isDone(t))||null;

/* ---------- Small UI pieces ---------- */
const HOME_ICON='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>';
const crumb=(label,trail)=>`<div class="crumbbar"><button class="backlink" data-crumb="back" aria-label="Back to ${esc(label)}">← ${esc(label)}</button><span class="trail">${trail}</span><button class="homebtn" data-crumb="home" aria-label="Home" title="Home">${HOME_ICON}</button></div>`;
const ring=(p,size=64,done=false)=>{const r=(size-8)/2,c=2*Math.PI*r;return `<span class="ring ${done?'complete':''}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" class="ring-bg"/><circle cx="${size/2}" cy="${size/2}" r="${r}" class="ring-fg" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(1)}"/></svg><b>${done?'✓':p+'%'}</b></span>`};
const bar=(d,n)=>`<div class="cprogress"><div class="progress"><span style="width:${n?Math.round(d/n*100):0}%"></span></div><small>${d} of ${n} classes completed${n&&d===n?' · ✓ All done':''}</small></div>`;
function paceText(t){if(!t.questions)return '';const n=t.questions.length,all=t.questions.map((_,i)=>qSeconds(t,i)),same=all.every(s=>s===all[0]);return same?all[0]+' s each':'about '+Math.round(totalSec(t)/n)+' s each'}
function metaOf(t){if(t.questions)return `${t.questions.length} questions · ${paceText(t)}${t.audioText?' + audio':''} · ~${t.duration} min`;if(t.mode==='writing')return `${t.duration} min · ${({'ielts-t1':'150+ words','ielts-t2':'250+ words','pte-swt':'one sentence, 5–75 words','pte-essay':'200–300 words'})[t.task]||'self-review'}`;if(t.mode==='speaking')return t.tasks?`${t.tasks.length} tasks · ~${t.duration} min · live coach`:`3 parts · ~${t.duration} min · live examiner`;if(t.mode==='overall')return `${t.modules.length} sections · ~${t.duration} min`;return ''}
function classRow(t,i,next){const d=isDone(t),prog=inProgress(t),b=d?bestLabel(t):'';return `<button class="classrow ${d?'done':''} ${prog?'inprog':''} ${t===next?'next':''}" data-start="${t.id}"><span class="cnum">${d?'✓':String(i+1).padStart(2,'0')}</span><span class="cbody"><b>${esc(short(t))}</b><small>${esc(metaOf(t))}</small></span><span class="cstate">${d?esc(b):prog?'Resume':t===next?'Up next':'Start'}</span><span class="chev" aria-hidden="true">›</span></button>`}

/* ---------- Pages ---------- */
let cExam='IELTS',cSec=null,cFrom='home';
function courseCard(c){const s=coursePct(c.exam),done=s.n&&s.d===s.n,secs=SECTIONS[c.exam].filter(x=>!x.foundation&&!x.wide).length;
 return `<button class="coursecard clickable ${done?'done':''}" data-course="${c.exam}" aria-label="Open ${esc(c.title)}">${done?'<span class="doneTick" title="Course completed">✓</span>':''}<div class="cc-top"><div class="courseIcon" style="background:${c.color}">${c.icon}</div>${ring(s.p,52,done)}</div><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p><div class="progress"><span style="width:${s.p}%"></span></div><div class="courseFoot"><small>${s.d} of ${s.n} classes · ${secs} sections + ${c.exam==='SAT'?'practice':'mock'} tests</small><span class="btn ghost small">Open →</span></div></button>`}
window.courses=()=>tracks.map(courseCard).join('');
function continueCard(){const drafts=Object.entries(state.drafts).map(([id,d])=>({t:tests.find(x=>x.id===id),d})).filter(x=>x.t&&!x.t.hidden&&inProgress(x.t)).sort((a,b)=>(b.d.updated||0)-(a.d.updated||0));
 if(drafts.length){const {t,d}=drafts[0],pos=t.questions?`Question ${(d.index||0)+1} of ${t.questions.length}`:t.mode==='overall'?`${Object.keys(d.done||{}).length} of ${t.modules.length} sections done`:t.mode==='writing'?`${((d.response||'').match(/\S+/g)||[]).length} words written`:'In progress';
  return `<div class="panel continue"><div><span class="tag">Continue where you left off</span><h3>${esc(t.title)}</h3><small class="muted">${esc(COURSE_INFO[t.exam]?.name||t.exam)} · ${esc(pos)}</small></div><button class="btn primary" data-start="${t.id}">Resume →</button></div>`}
 const last=state.results[0],exam=last?.exam&&COURSE_INFO[last.exam]?last.exam:'IELTS';for(const sec of SECTIONS[exam]){const nx=nextIn(secTests(exam,sec));if(nx)return `<div class="panel continue"><div><span class="tag">${state.results.length?'Up next':'Start here'} · ${esc(COURSE_INFO[exam].name)} · ${esc(sec.title)}</span><h3>${esc(short(nx))}</h3><small class="muted">${esc(metaOf(nx))}</small></div><button class="btn primary" data-start="${nx.id}">Start →</button></div>`}return ''}
window.home=function(){const s=stats();return `<div class="hero"><div class="eyebrow">Your preparation workspace</div><h1>Make every practice<br>session count<span style="color:#9ab4ff">.</span></h1><p>Welcome, ${esc(state.nickname||state.name)}. Choose a course, work through it class by class, and see exactly where you stand in IELTS, SAT and PTE.</p><div class="actions"><button class="btn white" data-nav="courses">Open my courses →</button><button class="btn glass" data-nav="tests">Practice library</button></div></div>${continueCard()}<div class="grid stats">${stat('Practice sessions',state.results.length,'Completed on this device')}${stat('Questions answered',s.total,'Auto-marked questions')}${stat('Average accuracy',s.accuracy,'Across marked questions')}${stat('Study streak',s.streak+(s.streak===1?' day':' days'),'Based on local activity')}</div><div class="sectiontitle"><h2>Choose your exam</h2><button class="textbtn" data-nav="courses">All courses →</button></div><div class="grid examgrid">${courses()}</div><div class="grid twocol"><div class="panel"><div class="testtop"><h3>Meet your speaking examiner</h3><span class="pill">LIVE · 2 EXAMINERS</span></div><p>A calm voice, one question at a time. Speak naturally — your examiner listens, follows up on what you actually said, and gives you a band estimate at the end.</p><button class="btn primary small" data-start="ielts-speaking-01">Start a speaking test →</button></div><div class="panel"><h3>Today’s study nudge</h3><div style="font-size:1.6rem">✧</div><b style="font-size:.85rem">Review before you repeat.</b><p>Understanding one mistake can be more useful than rushing through another set.</p><button class="btn ghost small" data-nav="review">Open my results →</button></div></div>`};
window.coursePage=function(){const c=tracks.find(x=>x.exam===cExam)||tracks[0],s=coursePct(c.exam),done=s.n&&s.d===s.n,secs=SECTIONS[c.exam];let next=courseTests(c.exam).filter(inProgress).sort((x,y)=>(state.drafts[y.id].updated||0)-(state.drafts[x.id].updated||0))[0]||null,nextSec=next?secs.find(x=>x.f(next)):null;if(!next)for(const sec of secs.filter(x=>!x.foundation)){const nx=nextIn(secTests(c.exam,sec));if(nx){next=nx;nextSec=sec;break}}
 const card=sec=>{const ts=secTests(c.exam,sec),dn=ts.filter(isDone).length,all=ts.length&&dn===ts.length,mins=ts.reduce((n,t)=>n+t.duration,0);return `<button class="seccard ${all?'done':''} ${sec.wide?'wide':''}" data-sec="${sec.key}" ${ts.length?'':'disabled'}>${all?'<span class="doneTick" title="Section completed">✓</span>':''}<span class="secicon" aria-hidden="true">${sec.icon}</span><span class="sectext"><h3>${esc(sec.title)}</h3><p>${esc(sec.desc)}</p></span><span class="secmeta"><span>${ts.length} ${ts.length===1?'class':'classes'} · ~${Math.round(mins/60*10)/10} h</span><span>${dn} done</span></span><span class="progress"><span style="width:${ts.length?Math.round(dn/ts.length*100):0}%"></span></span></button>`};
 return crumb(cFrom==='courses'?'Courses':'Dashboard',esc(c.title))+`<div class="course-hero"><div class="ch-main"><div class="courseIcon big" style="background:${c.color}">${c.icon}</div><div><div class="eyebrow">Course${done?' · ✓ Completed':''}</div><h1>${esc(c.title)}</h1><p>${esc(c.desc)}</p></div></div>${ring(s.p,84,done)}</div>${bar(s.d,s.n)}`+
 (next?`<div class="panel continue"><div><span class="tag">${inProgress(next)?'Resume':'Up next'} · ${esc(nextSec.title)}</span><h3>${esc(short(next))}</h3><small class="muted">${esc(metaOf(next))}</small></div><button class="btn primary" data-start="${next.id}">${inProgress(next)?'Resume':'Start'} →</button></div>`:'')+
 `<div class="sectiontitle"><h2>Exam sections</h2></div><div class="secgrid">${secs.filter(x=>!x.foundation&&!x.wide).map(card).join('')}</div><div class="secgrid" style="margin-top:14px">${secs.filter(x=>x.wide).map(card).join('')}</div>`+
 (secs.some(x=>x.foundation)?`<div class="sectiontitle"><h2>Foundation skills</h2></div><div class="secgrid">${secs.filter(x=>x.foundation).map(card).join('')}</div>`:'')+
 `<div class="panel" style="margin-top:18px"><h3>About the real exam</h3>${secs.filter(x=>!x.foundation).map(x=>`<div class="setting"><b>${esc(x.title)}</b><small>${esc(x.real)}</small></div>`).join('')}<p class="muted" style="margin-top:10px">Classes here are shorter than the real exam but timed at real exam pace.</p></div>`};
window.sectionPage=function(){const c=tracks.find(x=>x.exam===cExam)||tracks[0],sec=SECTIONS[c.exam].find(s=>s.key===cSec)||SECTIONS[c.exam][0],ts=secTests(c.exam,sec),d=ts.filter(isDone).length,next=nextIn(ts),all=ts.length&&d===ts.length;
 const groups=sec.groups?sec.groups.map(([title,f])=>[title,ts.filter(f)]).filter(([,l])=>l.length):[[null,ts]];let k=0;
 const pace=ts.find(t=>t.questions);
 return crumb(c.title,esc(c.title)+' › '+esc(sec.title))+`<div class="pagehead sechead"><div><div class="eyebrow">${esc(c.title)}${all?' · ✓ Section complete':''}</div><h1><span class="secicon inline" aria-hidden="true">${sec.icon}</span>${esc(sec.title)}</h1><p>${esc(sec.desc)}</p></div></div>${bar(d,ts.length)}`+
 `<div class="infochips"><span>⏱ ${pace?esc(paceLabel(pace)):sec.key==='speaking'?'Timed answers, like the real test':sec.wide?'Take a break between sections':'Suggested time per task'}</span><span>🎯 ${esc(sec.real)}</span></div>`+
 groups.map(([title,list])=>(title?`<h3 class="grouptitle">${esc(title)}</h3>`:'')+`<div class="classlist">${list.map(t=>classRow(t,k++,next)).join('')}</div>`).join('')+(ts.length?'':'<div class="empty">No classes here yet.</div>')};
function library(){const rows=visibleTests().filter(t=>(exam==='All'||t.exam===exam)&&(skill==='All'||t.skill===skill));const skills=['All','Listening','Reading','Writing','Speaking','Math','English','Grammar','Overall'];
 return heading('Practice library','All practice','Every class from every course in one place.','<span class="pill">'+visibleTests().length+' CLASSES</span>')+`<div class="filters">${['All','IELTS','SAT','PTE'].map(e=>`<button class="chip ${exam===e?'active':''}" data-exam="${e}">${e==='All'?'All exams':e}</button>`).join('')}</div><div class="filters">${skills.map(s=>`<button class="chip ${skill===s?'active':''}" data-skill="${s}">${s==='All'?'All skills':s==='English'?'Reading & Writing':s==='Overall'?'Mock tests':s}</button>`).join('')}</div><div class="classlist" style="margin-top:14px">${rows.length?rows.map((t,i)=>classRow(t,i,null).replace('<b>',`<b><span class="tag">${esc(t.exam)} · ${esc(t.skill==='Overall'?'Mock':t.skill==='English'?'R&W':t.skill)}</span> `)).join(''):'<div class="empty">No classes match. Try a different exam or skill.</div>'}</div>`}
function results(){const rows=state.results;return heading('Learn from every attempt','My results','Your practice history, saved on this device.')+(rows.length?rows.map((r,i)=>{const e=tqEstimate(r);return `<article class="panel resultrow"><div class="testtop"><div><span class="tag">${esc(r.exam)} · ${esc(r.skill)}</span><h3 style="margin:6px 0">${esc(r.title)}</h3><small class="muted">${new Date(r.date).toLocaleString()}</small></div><span class="pill">${r.mode==='quiz'?r.correct+'/'+r.total+' correct':e?e.label+' '+e.value:r.skill==='Speaking'?'Speaking review':'Saved'}</span></div>${r.mode==='quiz'?`<div class="progress"><span style="width:${r.percent}%"></span></div>`:''}<button class="btn ghost small" data-result="${i}">View review →</button></article>`}).join(''):'<div class="empty">Your completed classes will appear here.</div>')}
function progress(){const s=stats(),rows=state.results.filter(r=>r.mode==='quiz');return heading('Your learning signals','Progress','See what you have finished and what to practise next.')+`<div class="grid stats">${tracks.map(t=>{const c=coursePct(t.exam);return stat(t.title,c.p+'%',c.d+' of '+c.n+' classes')}).join('')}${stat('Best accuracy',rows.length?Math.max(...rows.map(r=>r.percent))+'%':'—','Marked questions')}</div>`+
 tracks.map(c=>`<div class="panel" style="margin-bottom:14px"><h3>${esc(c.title)}</h3>${SECTIONS[c.exam].map(sec=>{const ts=secTests(c.exam,sec),dn=ts.filter(isDone).length;return `<div class="setting"><div><b>${sec.icon} ${esc(sec.title)}</b><small>${dn} of ${ts.length} classes</small></div><div class="minibar"><span style="width:${ts.length?Math.round(dn/ts.length*100):0}%"></span></div></div>`}).join('')}</div>`).join('')+
 `<div class="panel"><h3>Accuracy by skill</h3>${['Reading','Listening','Math','English','Grammar'].map(sk=>{const rs=rows.filter(r=>r.skill===sk),n=rs.reduce((a,r)=>a+r.total,0),c=rs.reduce((a,r)=>a+r.correct,0);return `<div class="setting"><b>${sk==='English'?'Reading & Writing (SAT)':sk}</b><small>${n?Math.round(c/n*100)+'% · '+n+' questions':'Not attempted'}</small></div>`}).join('')}</div><div class="panel" style="margin-top:16px"><h3>Understanding these scores</h3><p>Accuracy and band or score estimates come from short practice sets. They show your direction of travel, not an official IELTS band, SAT score or PTE score.</p></div>`}
window.library=library;window.results=results;window.progress=progress;

window.render=function(){const views={home,course:coursePage,section:sectionPage,courses:()=>heading('Learning paths','Courses','Pick an exam. Each course is split into sections, and each section into classes.')+`<div class="grid examgrid">${courses()}</div><div class="panel" style="margin-top:18px"><h3>How courses work</h3><p>Open a course to see its sections — for IELTS: Listening, Reading, Writing, Speaking and Mock Tests. Each section lists its classes. A green tick marks every class, section and course you finish.</p></div>`,tests:library,review:results,progress,profile,settings,help:()=>heading('A few useful details','Help & about','Make yourself at home.')+`<div class="panel"><h3>Courses, sections and classes</h3><p>Open a course from the dashboard. Choose a section, then a class. Finished classes get a green tick; finish every class in a section or course to tick that too. The home button at the top right always brings you back to the dashboard.</p><h3>Timing</h3><p>Every question has its own clock, set to real exam pace — for example 30 seconds for a grammar item and 95 seconds for an SAT Math question. Passages add reading time, and the clock pauses while a listening recording plays. Turn on Exam mode in Settings to hide answers until the end.</p><h3>Your examiners</h3><p>The speaking examiner listens, asks follow-up questions about what you said and gives a band (IELTS) or score (PTE) estimate. The writing examiner marks essays instantly on this device and highlights errors. Connecting your own AI service in Settings adds model-generated follow-ups and audio assessment.</p><h3>Sound & permissions</h3><p>Ambient audio needs a tap to begin. It pauses during tests and when the app is hidden. Microphone and notification access can be requested in Settings.</p><h3>About</h3><p>TESTRIQ · BY SYMETREE<br>Designed and developed by Md Sajid Shahriar Bhuiyan.</p></div>`};
 $('#main').innerHTML=(views[page]||home)()+`<footer>TESTRIQ · A SYMETREE learning product<br>Designed and developed by Md Sajid Shahriar Bhuiyan</footer>`;
 const nav=page==='course'||page==='section'?'courses':page;$('#desktopNav').innerHTML=navItems.map(n=>navButton(n).replace(`navbtn ${page===n[0]?'active':''}`,`navbtn ${nav===n[0]?'active':''}`)).join('');
 const mob={home:'Home',courses:'Courses',tests:'Practice',review:'Results',profile:'Profile'};$('#mobileNav').innerHTML=navItems.filter(n=>mob[n[0]]).map(n=>`<button class="navbtn ${nav===n[0]?'active':''}" data-nav="${n[0]}" ${nav===n[0]?'aria-current="page"':''}><span aria-hidden="true">${n[1]}</span>${mob[n[0]]}</button>`).join('');
 bindPage();if(page==='settings')renderPermissions()};
const top=()=>{try{window.scrollTo(0,0)}catch{}};
window.navigate=function(p){if(TQH.deep){TQH.deep=false;tqHistoryBack(1)}page=p;render();top()};
window.tqGoHome=function(){if(TQH.deep){TQH.deep=false;tqHistoryBack(1)}page='home';render();top()};
window.openCourse=function(ex){if(!COURSE_INFO[ex])return;cExam=ex;if(page!=='course'&&page!=='section')cFrom=page==='courses'?'courses':'home';tqEnsureDeep();page='course';render();top()};
const openSection=key=>{cSec=key;tqEnsureDeep();page='section';render();top()};
window.tqPageUp=function(){if(page==='section'){tqEnsureDeep();page='course'}else if(page==='course')page=cFrom;render();top()};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.sec)openSection(b.dataset.sec);else if(b.dataset.crumb==='back'){if(TQH.deep)history.back();else tqPageUp()}else if(b.dataset.crumb==='home')tqGoHome()});

/* ---------- Celebrate completions ---------- */
window.tqAfterResult=function(row){const t=tests.find(x=>x.id===row.testId);if(!t)return;cacheKey='';const first=resultsFor(t).length===1;if(!first)return;const list=tqSectionOf(t);const sec=(SECTIONS[t.exam]||[]).find(s=>s.f(t));
 if(window.courseDone(t.exam))setTimeout(()=>notify('🏆 Course complete: '+COURSE_INFO[t.exam].name+'!'),400);else if(list&&list.every(isDone))setTimeout(()=>notify('🎉 Section complete: '+sec.title+'. Great work!'),400);else setTimeout(()=>notify('✓ Class complete. '+(list?list.filter(isDone).length+' of '+list.length+' in '+sec.title+'.':'')),400)};
})();

apply();render();
</script>
</body></html>
