['A New Translation','The translator retained the novel’s short sentences but changed several idioms. Literal versions of those phrases would have confused modern readers. Her choices aimed to preserve the effect of the original rather than its exact wording.','Translation may preserve an effect by changing wording.','Every idiom was translated word for word.','retained','kept'],

ntinuous forms", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "At the moment, she _____ for her exam.", "options": ["study", "has study", "is studying", "studies yesterday"], "answer": 2, "explanation": "At the moment signals an action in progress."}, {"prompt": "I _____ dinner when you called.", "options": ["cook", "was cooking", "am cook", "have cooked tomorrow"], "answer": 1, "explanation": "Past continuous describes the ongoing background action."}, {"prompt": "A “temporary” arrangement lasts _____.", "options": ["for a limited time", "forever", "without change", "for everyone"], "answer": 0, "explanation": "Temporary means not permanent."}, {"prompt": "The team is making steady _____.", "options": ["progresses", "progressed", "progressing", "progress"], "answer": 3, "explanation": "Progress is an uncountable noun here."}]}, {"id": "ielts-grammar-04", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 4 · Perfect tenses", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "By the time we arrived, the film _____.", "options": ["starting", "had started", "has start", "starts tomorrow"], "answer": 1, "explanation": "Past perfect marks an event before another past event."}, {"prompt": "They have known each other _____ ten years.", "options": ["for", "since", "during of", "from since"], "answer": 0, "explanation": "For introduces a duration."}, {"prompt": "“Previously” means _____.", "options": ["next year", "at every moment", "without reason", "before now or then"], "answer": 3, "explanation": "Previously refers to an earlier time."}, {"prompt": "She has _____ valuable experience.", "options": ["made up of", "taken off", "gained", "done"], "answer": 2, "explanation": "Gain experience is a natural collocation."}]}, {"id": "ielts-grammar-05", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 5 · Future plans", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "Look at those dark clouds. It _____ rain.", "options": ["is going to", "going", "has", "was to yesterday"], "answer": 0, "explanation": "Going to expresses a prediction based on current evidence."}, {"prompt": "This time tomorrow, I _____ on the train.", "options": ["will travelling", "am travel", "have travel", "will be travelling"], "answer": 3, "explanation": "Future continuous describes an action in progress at a future time."}, {"prompt": "“Anticipate” most nearly means _____.", "options": ["refuse", "conceal", "expect", "forget"], "answer": 2, "explanation": "To anticipate something is to expect it."}, {"prompt": "We need to _____ a deadline for the project.", "options": ["take after", "set", "do", "give away"], "answer": 1, "explanation": "Set a deadline means establish a completion date."}]}, {"id": "ielts-grammar-06", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 6 · Articles", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "She is _____ engineer.", "options": ["a", "the a", "no an", "an"], "answer": 3, "explanation": "Use an before a vowel sound."}, {"prompt": "_____ sun provides light and heat.", "options": ["An", "These", "The", "A"], "answer": 2, "explanation": "The is used for the sun, a unique object in this context."}, {"prompt": "“Essential” means _____.", "options": ["rare", "necessary", "optional", "irrelevant"], "answer": 1, "explanation": "Essential means necessary or indispensable."}, {"prompt": "We must take the cost into _____.", "options": ["account", "counted", "accountant", "accounting for"], "answer": 0, "explanation": "Take into account means consider."}]}, {"id": "ielts-grammar-07", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 7 · Countable nouns", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "There is not _____ information in this leaflet.", "options": ["a few", "several", "much", "many"], "answer": 2, "explanation": "Information is uncountable, so use much."}, {"prompt": "How _____ applicants attended the interview?", "options": ["an", "many", "much", "little"], "answer": 1, "explanation": "Applicants is a plural countable noun."}, {"prompt": "“Scarce” resources are _____.", "options": ["in short supply", "unlimited", "wasted deliberately", "free of charge"], "answer": 0, "explanation": "Scarce means not available in sufficient quantities."}, {"prompt": "The survey collected a large _____ of responses.", "options": ["amount", "much", "little", "number"], "answer": 3, "explanation": "Use number with plural countable nouns."}]}, {"id": "ielts-grammar-08", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 8 · Comparisons", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "This route is _____ than the old one.", "options": ["most short", "shorter", "shortest", "more shorter"], "answer": 1, "explanation": "Use the comparative shorter with than."}, {"prompt": "Of the three solutions, this is the _____ practical.", "options": ["most", "more", "much", "many"], "answer": 0, "explanation": "Use a superlative to compare three solutions."}, {"prompt": "“Similar” means _____.", "options": ["opposite", "unknown", "isolated", "alike"], "answer": 3, "explanation": "Similar things share characteristics."}, {"prompt": "The two reports have a great deal in _____.", "options": ["ordinary", "typical", "common", "usual"], "answer": 2, "explanation": "Have in common means share features."}]}, {"id": "ielts-grammar-09", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 9 · Modal verbs", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "Visitors _____ wear a helmet; it is compulsory.", "options": ["must", "might", "may", "could perhaps"], "answer": 0, "explanation": "Must expresses an obligation."}, {"prompt": "You _____ bring food; lunch is provided.", "options": ["must not ever", "cannot possibly", "should not have", "do not need to"], "answer": 3, "explanation": "Do not need to expresses lack of necessity, not prohibition."}, {"prompt": "“Mandatory” means _____.", "options": ["unlikely", "voluntary", "required", "possible"], "answer": 2, "explanation": "Mandatory means compulsory."}, {"prompt": "Students should _____ responsibility for their work.", "options": ["give out", "take", "make", "do"], "answer": 1, "explanation": "Take responsibility is the standard expression."}]}, {"id": "ielts-grammar-10", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 10 · Conditionals", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "If it rains tomorrow, we _____ indoors.", "options": ["would stayed", "had stayed", "staying", "will stay"], "answer": 3, "explanation": "First conditional uses if plus present, then will plus base verb."}, {"prompt": "If I had more time, I _____ another language.", "options": ["had learn", "learning", "would learn", "will learned"], "answer": 2, "explanation": "Second conditional describes a hypothetical present situation."}, {"prompt": "“Feasible” means _____.", "options": ["unnecessary", "possible to carry out", "certain to fail", "already finished"], "answer": 1, "explanation": "A feasible plan can be carried out."}, {"prompt": "We should _____ the risks before deciding.", "options": ["assess", "access to", "assist to", "assign to"], "answer": 0, "explanation": "Assess means evaluate."}]}, {"id": "ielts-grammar-11", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 11 · Passive voice", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "The bridge _____ in 1998.", "options": ["has build", "is building", "was built", "built"], "answer": 2, "explanation": "Past simple passive uses was or were plus past participle."}, {"prompt": "The results will _____ tomorrow.", "options": ["have announce", "be announced", "announced", "be announcing by themselves"], "answer": 1, "explanation": "Future passive uses will be plus past participle."}, {"prompt": "“Manufacture” means _____.", "options": ["produce goods", "purchase tickets", "repair roads only", "deliver speeches"], "answer": 0, "explanation": "Manufacture means make goods, especially industrially."}, {"prompt": "The new rule will come into _____ next month.", "options": ["affect", "effort", "effective", "effect"], "answer": 3, "explanation": "Come into effect means begin to apply."}]}, {"id": "ielts-grammar-12", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 12 · Reported speech", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "She said that she _____ tired that day.", "options": ["being", "was", "be", "were"], "answer": 1, "explanation": "Reported speech commonly shifts present simple to past simple."}, {"prompt": "He asked me where I _____.", "options": ["lived", "did live in", "do live", "living"], "answer": 0, "explanation": "Reported questions use statement word order."}, {"prompt": "“Claim” as a reporting verb means _____.", "options": ["prove beyond doubt", "deny everything", "ask permission", "state that something is true"], "answer": 3, "explanation": "A claim states something; it does not necessarily prove it."}, {"prompt": "The witness _____ evidence in court.", "options": ["made", "built", "gave", "did"], "answer": 2, "explanation": "Give evidence is the standard collocation."}]}, {"id": "ielts-grammar-13", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 13 · Relative clauses", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "The woman _____ lives next door is a doctor.", "options": ["who", "which", "where", "whose"], "answer": 0, "explanation": "Who introduces a relative clause about a person."}, {"prompt": "This is the village _____ I grew up.", "options": ["who", "whose", "which place of", "where"], "answer": 3, "explanation": "Where introduces a relative clause about a place."}, {"prompt": "“Resident” means _____.", "options": ["an empty building", "a travel document", "a person who lives in a place", "a passing tourist only"], "answer": 2, "explanation": "A resident lives in a particular place."}, {"prompt": "The centre offers a wide _____ of courses.", "options": ["distance", "range", "length", "height"], "answer": 1, "explanation": "A wide range means a broad variety."}]}, {"id": "ielts-grammar-14", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 14 · Gerunds & infinitives", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "She enjoys _____ in the evening.", "options": ["to reading", "read", "reads", "reading"], "answer": 3, "explanation": "Enjoy is followed by a gerund."}, {"prompt": "They decided _____ early.", "options": ["leave to", "left", "to leave", "leaving"], "answer": 2, "explanation": "Decide is followed by a to-infinitive."}, {"prompt": "“Reluctant” means _____.", "options": ["careless", "unwilling or hesitant", "eager", "certain"], "answer": 1, "explanation": "Reluctant describes hesitation or unwillingness."}, {"prompt": "He is interested _____ environmental science.", "options": ["in", "on", "at", "for"], "answer": 0, "explanation": "Interested takes the preposition in."}]}, {"id": "ielts-grammar-15", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 15 · Prepositions", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "The lecture starts _____ nine o’clock.", "options": ["on", "by at", "at", "in"], "answer": 2, "explanation": "Use at for a clock time."}, {"prompt": "She has lived here _____ July.", "options": ["from since", "since", "for", "during for"], "answer": 1, "explanation": "Since introduces the starting point of a continuing situation."}, {"prompt": "“Adjacent” means _____.", "options": ["next to", "far beyond", "underneath only", "opposite in meaning"], "answer": 0, "explanation": "Adjacent means next to or adjoining."}, {"prompt": "The outcome depends _____ several factors.", "options": ["at", "of", "by", "on"], "answer": 3, "explanation": "Depend takes on."}]}, {"id": "ielts-grammar-16", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 16 · Linking ideas", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "_____ it was raining, they continued the match.", "options": ["However of", "Although", "Because of", "Despite of"], "answer": 1, "explanation": "Although introduces a clause expressing contrast."}, {"prompt": "The road was closed; _____, we took another route.", "options": ["therefore", "similarly", "for instance", "nevertheless"], "answer": 0, "explanation": "Therefore introduces the resulting action."}, {"prompt": "“Moreover” adds _____.", "options": ["an opposite conclusion", "a time limit", "a question", "another supporting point"], "answer": 3, "explanation": "Moreover introduces additional supporting information."}, {"prompt": "We need to draw a clear _____ between the two terms.", "options": ["distinguish", "distinctly", "distinction", "distinct"], "answer": 2, "explanation": "Draw a distinction means point out a difference."}]}, {"id": "ielts-grammar-17", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 17 · Agreement", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "Each of the students _____ a locker.", "options": ["has", "have", "having", "are have"], "answer": 0, "explanation": "Each is singular and takes has."}, {"prompt": "The results of the experiment _____ encouraging.", "options": ["is", "being", "was being a", "are"], "answer": 3, "explanation": "Results is the plural subject."}, {"prompt": "“Consistent” means _____.", "options": ["rarely seen", "unfinished", "following the same pattern", "changing randomly"], "answer": 2, "explanation": "Consistent describes regularity or agreement."}, {"prompt": "The study provides strong _____ for the theory.", "options": ["evidences of", "evidence", "evident", "evidently"], "answer": 1, "explanation": "Evidence is an uncountable noun in this usage."}]}, {"id": "ielts-grammar-18", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 18 · Word formation", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "The instructions were explained _____.", "options": ["clear", "clarity", "clearness of", "clearly"], "answer": 3, "explanation": "An adverb modifies explained."}, {"prompt": "We need a more _____ solution.", "options": ["effectiveness", "effects", "effective", "effectively"], "answer": 2, "explanation": "An adjective modifies solution."}, {"prompt": "“Sustainable” describes something that _____.", "options": ["never needs planning", "can be maintained over time", "must end immediately", "uses every resource at once"], "answer": 1, "explanation": "Sustainable practices can continue over time."}, {"prompt": "The company aims to _____ waste.", "options": ["reduce", "reduction", "reduced of", "reductive"], "answer": 0, "explanation": "After to, use the base verb reduce."}]}, {"id": "ielts-grammar-19", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 19 · Academic vocabulary", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "The research _____ that sleep affects memory.", "options": ["suggesting", "have suggest", "suggests", "suggest"], "answer": 2, "explanation": "Research is singular and takes suggests."}, {"prompt": "There is _____ evidence to support the claim.", "options": ["many", "little", "few", "a few"], "answer": 1, "explanation": "Use little with uncountable evidence."}, {"prompt": "“Significant” means _____.", "options": ["important or notable", "unrelated", "invisible", "ordinary in every case"], "answer": 0, "explanation": "Significant describes importance or a notable effect."}, {"prompt": "The findings _____ an important issue.", "options": ["highly", "height", "higher", "highlight"], "answer": 3, "explanation": "Highlight means draw attention to."}]}, {"id": "ielts-grammar-20", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 20 · Mixed review", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "If she had left earlier, she _____ the train.", "options": ["has catch", "would have caught", "will catch", "would caught"], "answer": 1, "explanation": "Third conditional uses would have plus past participle."}, {"prompt": "By next June, I _____ the course.", "options": ["will have completed", "will completing", "have complete", "had completing"], "answer": 0, "explanation": "Future perfect describes completion before a future point."}, {"prompt": "“Mitigate” means _____.", "options": ["make permanent", "ignore entirely", "measure exactly", "make less severe"], "answer": 3, "explanation": "Mitigate means reduce severity or harmful effects."}, {"prompt": "The organisation aims to _____ awareness of recycling.", "options": ["arise", "arouse up", "raise", "rise"], "answer": 2, "explanation": "Raise awareness is the standard collocation."}]}];

function stats(){const rows=state.results.filter(r=>r.mode==='quiz'),total=rows.reduce((n,r)=>n+(r.total||0),0),correct=rows.reduce((n,r)=>n+(r.correct||0),0);const days=new Set(state.results.map(r=>new Date(r.date).toLocaleDateString()));let day=new Date(),streak=0;if(!days.has(day.toLocaleDateString()))day.setDate(day.getDate()-1);while(days.has(day.toLocaleDateString())){streak++;day.setDate(day.getDate()-1)}return {total,correct,accuracy:total?Math.round(correct/total*100)+'%':'—',streak}}
function stat(label,value,sub){return `<div class="stat"><div class="statTop">${label}</div><strong>${value}</strong><small>${sub}</small></div>`}
function profile(){return heading('Your space','Profile','A familiar face. A name that feels like you.')+`<div class="panel profilehero"><div class="pfpic">${state.photo?`<img src="${esc(state.photo)}" alt="Your profile photo">`:esc((state.name.trim()[0]||'L').toUpperCase())}</div><div><h2 style="margin-bottom:4px">${esc(state.name)}</h2><p>${state.nickname?'Your examiner calls you '+esc(state.nickname):'Add a nickname for your practice sessions.'}</p><div class="actions"><button class="btn primary small" id="choosePhoto">Choose from gallery</button><button class="btn ghost small" id="removePhoto" ${state.photo?'':'disabled'}>Remove photo</button></div><input type="file" id="photoFile" accept="image/*" hidden></div></div><div class="grid settingsgrid" style="margin-top:18px"><form id="profileForm" class="panel"><h3>Your details</h3><label class="field">User name<input id="userName" maxlength="24" required value="${esc(state.name)}" autocomplete="nickname"></label><label class="field">Nickname<input id="nickname" maxlength="16" value="${esc(state.nickname)}" placeholder="What should your examiner call you?"></label><p class="muted">Your profile and photo stay on this browser.</p><button class="btn primary" type="submit">Save profile</button></form><div class="panel"><h3>Make it your own</h3><p>Use a photo from your device. Testriq resizes it for your profile and stores it locally.</p><p>Your nickname appears in greetings from your examiner. It is optional and you can change it anytime.</p><button class="btn ghost small" data-nav="settings">Sound & preferences →</button></div></div>`}
function switchRow(key,title,desc){return `<div class="setting"><div><b>${title}</b><small>${desc}</small></div><button role="switch" aria-checked="${!!state[key]}" aria-label="${title}" class="switch ${state[key]?'on':''}" data-toggle="${key}"></button></div>`}
function settings(){return heading('Make Testriq yours','Settings','A little comfort goes a long way.')+`<div class="grid settingsgrid"><div class="panel"><h3>Appearance & accessibility</h3><div class="setting"><div><b>Theme</b><small>Choose your preferred appearance</small></div><select id="themeSelect" aria-label="Theme"><option value="light" ${state.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option></select></div>${switchRow('motion','Reduce motion','Limit animations, including the opening screen')}${switchRow('large','Larger text','Increase reading size')}${switchRow('examMode','Exam mode','Hide answers until the end of each quiz, like the real test')}<div class="setting"><div><b>Daily goal</b><small>Questions you aim to practise</small></div><select id="goal" aria-label="Daily question goal">${[5,10,15,20,30].map(n=>`<option ${Number(state.goal)===n?'selected':''}>${n}</option>`).join('')}</select></div><p class="muted">Today: ${state.results.filter(r=>r.mode==='quiz'&&new Date(r.date).toLocaleDateString()===new Date().toLocaleDateString()).reduce((n,r)=>n+r.total,0)} / ${state.goal} questions</p></div><div class="panel"><h3>Sound & voice</h3>${switchRow('music','Ambient sound','A gentle synthesized background tone. Pauses during practice and when the app is hidden.')}${switchRow('ticks','Timer sounds','Ticks in the final ten seconds and a completion bell')}${switchRow('voice','Examiner voice','Read listening passages and speaking questions aloud')}<div class="setting"><b>Volume</b><input id="volume" type="range" min="0" max="100" value="${state.volume}" aria-label="Sound volume"></div><button id="testSound" class="btn ghost small">Test timer bell</button></div><div class="panel"><h3>Permissions</h3><p>Manage the access Testriq uses. Your browser makes the final permission decision.</p><div id="permissions"></div><button class="btn ghost small" id="refreshPermissions">Refresh status</button></di const MIC='<svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M8.5 21.5h7"/></svg>';
const alive=(a,tok)=>active===a&&a.live&&a.live.tok===tok&&!a.live.paused;
const isPTE=a=>a.test.exam!=='IELTS';

/* ---------- interview plan ---------- */
function plan(a){const t=a.test,hi=state.nickname?', '+state.nickname:'',ex=examinerFor(a.examinerId).name,T=[];
 if(t.exam==='IELTS'){
  T.push({part:0,label:'Introduction',kind:'qa',id:true,q:'Could you tell me your full name, please?',say:`Good day${hi}. My name is ${ex}, and I will be your examiner today. Could you tell me your full name, please?`,max:20});
  if(t.prompts&&t.prompts.length>=3){const p=t.prompts;
   split(p[0].text).forEach((q,i)=>T.push({part:0,label:p[0].part,kind:'qa',q,say:(i?'':'Thank you. Now I would like to ask you some questions about yourself. ')+q,max:40,follow:true}));
   T.push({part:1,label:p[1].part,kind:'long',q:p[1].text,say:'Now, I am going to give you a topic, and I would like you to talk about it for one to two minutes. You have one minute to prepare, and you can make notes. Here is your topic.',prep:60,go:'All right. Please start speaking now.',max:120,silence:5000});
   split(p[2].text).forEach((q,i)=>T.push({part:2,label:p[2].part,kind:'qa',q,say:(i?'':'Thank you. We have been talking about this topic, and now I would like to discuss some more general questions related to it. ')+q,max:60,follow:true}));
  }else split(t.prompt||'Tell me about yourself.').forEach((q,i)=>T.push({part:0,label:'Interview',kind:'qa',q,say:(i?'':'Thank you. Now I would like to ask you some questions. ')+q,max:45,follow:true}));
 }else if(t.tasks){const intro=`Hello${hi}. I am ${ex}, your PTE speaking coach. We will go through ${t.tasks.length} short tasks. Follow the instructions on the screen. `;const seen={};
  t.tasks.forEach((k,i)=>{const pre=i?'':intro,firstOf=!seen[k.type];seen[k.type]=1;
   if(k.type==='read')T.push({part:0,label:'Read aloud',kind:'read',q:k.text,say:pre+'Read aloud. Look at the text on the screen. You have thirty seconds to prepare, then read it aloud.',prep:30,go:'Please begin reading aloud now.',max:40,silence:3000,pte:k});
   else if(k.type==='repeat')T.push({part:1,label:'Repeat sentence',kind:'repeat',q:k.text,hint:'Listen, then repeat the sentence exactly as you hear it.',say:pre+(firstOf?'Repeat sentence. You will hear a sentence. Please repeat it exactly as you hear it. ':'')+k.text,max:15,silence:2000,pte:k});
   else if(k.type==='retell')T.push({part:2,label:'Retell lecture',kind:'retell',q:k.text,hint:'Listen to the lecture and note the key points. Then retell it in your own words.',say:pre+'Retell lecture. Listen to a short lecture, then retell it in your own words. '+k.text,prep:10,go:'Please retell the lecture now. You have forty seconds.',max:40,silence:3500,pte:k});
   else if(k.type==='asq')T.push({part:3,label:'Answer short question',kind:'asq',q:k.q,hint:'Answer with a single word or a few words.',say:pre+(firstOf?'Answer short question. A single word or a few words is enough. ':'')+k.q,max:10,silence:1600,pte:k});
   else if(k.type==='rts')T.push({part:4,label:'Respond to a situation',kind:'rts',q:k.text,say:pre+'Respond to a situation. Read the situation on the screen. You have twenty seconds to prepare, then forty seconds to respond.',prep:20,go:'Please respond now.',max:40,silence:3500,pte:k})})}
 else{const m=/^(.*?):\s*([\s\S]+)$/.exec(t.prompt||'');
  if(m){T.push({part:0,label:'Read aloud',kind:'read',q:m[2].trim(),say:`Hello${hi}. I am ${ex}, your speaking coach. Please look at the text on the screen. You have thirty seconds to prepare, then read it aloud.`,prep:30,go:'Please begin reading aloud now.',max:45,silence:3000})}
  else T.push({part:0,label:'Speaking task',kind:'qa',q:t.prompt||'',say:`Hello${hi}. I am ${ex}, your speaking coach. ${t.prompt||''}`,max:45})}

/* ---------- screens ---------- */
window.showSpeaking=function(){stopExaminerVoice();const a=active;if(!a)return;if(a.live&&a.live.stage==='run')return renderLive(a);a.live={stage:'lobby',tok:(a.live&&a.live.tok)||0};renderLobby(a)};
function renderLobby(a){const ex=examinerFor(a.examinerId),ielts=a.test.exam==='IELTS',t=a.test;
 const kinds=t.tasks?Object.entries(t.tasks.reduce((m,k)=>(m[k.type]=(m[k.type]||0)+1,m),{})).map(([k,n])=>({read:'Read aloud',repeat:'Repeat sentence',retell:'Retell lecture',asq:'Short answers',rts:'Respond to a situation'}[k]+(n>1?' ×'+n:''))):null;
 $('#modalBody').innerHTML=topbar()+`<div class="live-lobby"><div class="live-av big">${esc(ex.initials)}</div><h2>${esc(ex.name)}</h2><p class="muted">${ielts?'IELTS speaking examiner':'PTE speaking coach'}</p>${kinds?`<div class="infochips center">${kinds.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}${examinerPicker(a)}<ul class="live-rules">${ielts?`<li>Three parts, like the real test: introduction, a one-minute talk on a topic card, then a discussion.</li><li>${esc(ex.name)} listens and asks follow-up questions about what you actually said.</li><li>Speak naturally. When you finish and pause, he moves on — or tap the microphone to finish early.</li><li>You get an estimated band out of 9 with feedback for each criterion.</li>`:`<li>Each task is timed like the real PTE test.</li><li>Recordings start automatically after the prompt — speak as soon as the microphone turns blue.</li><li>Repeat-sentence and lecture audio play once, as in the exam.</li><li>You get an estimated score out of 90 with feedback for each task.</li>`}</ul><p class="status" id="voiceStatus" role="status"></p><div class="actions"><button class="btn ghost" id="testVoice">🔈 Test voice</button><button class="btn primary" id="startLive">Start ${ielts?'test':'practice'}</button></div></div>`;
 bindExaminerPicker(a);
 $('#testVoice').onclick=()=>{const tag=$('#voiceStatus');if(tag)tag.textContent='Playing a short test. You should hear '+ex.name+'.';speak(`Hello, I am ${ex.name}. Can you hear me clearly?`)};
 $('#startLive').onclick=()=>beginLive(a)}
function renderLive(a){const ex=examinerFor(a.examinerId),ielts=a.test.exam==='IELTS';
 $('#modalBody').innerHTML=topbar()+`<div class="live"><div class="live-head"><span class="tag" id="livePart"></span><span class="qtimer" id="qTimer"></span></div><div class="progress"><span id="liveBar" style="width:0"></span></div><div class="live-ex"><div class="live-av" id="liveAv">${esc(ex.initials)}</div><div><b>${esc(ex.name)}</b><span class="muted">${ielts?'IELTS examiner':'PTE speaking coach'}</span></div></div><div class="live-stage"><div id="cueCard" class="cue" hidden></div><div class="question examiner-subtitles live-caption" id="examinerCaption" aria-live="off"></div></div><p class="status" id="voiceStatus" role="status"></p><div class="live-transcript" id="liveText"></div><div id="typeBox" class="typebox" hidden><textarea id="typeAns" placeholder="Type your answer here…"></textarea><button class="btn primary" id="typeSend">Send answer</button></div><div class="live-mic"><button class="micbtn" id="liveMic" aria-label="Microphone">${MIC}</button><span id="micLabel" class="muted"></span></div></div>`;
 $('#liveMic').onclick=()=>micTap(a)}
const setStatus=m=>{const e=$('#voiceStatus');if(e)e.textContent=m||''};
function setMic(mode,label){const b=$('#liveMic');if(!b)return;b.className='micbtn '+mode;const l=$('#micLabel');if(l)l.textContent=label||''}
function level(db){const b=$('#liveMic');if(b)b.style.setProperty('--lv',Math.max(0,Math.min(1,(db+2)/12)).toFixed(2))}

/* ---------- microphone ---------- */
async function ensureMic(a){const L=a.live;L.blocked=false;
 try{
  if(native()){try{window.TestriqSpeech.requestPermissions&&window.TestriqSpeech.requestPermissions()}catch{}
   for(let i=0;i<48&&window.TestriqSpeech.hasMic&&!window.TestriqSpeech.hasMic();i++)await sleep(250);
   if(window.TestriqSpeech.hasMic&&!window.TestriqSpeech.hasMic())throw Error('denied');L.typed=false}
  else if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());L.typed=!WSR}
  else throw Error('unsupported');
 }catch(e){L.blocked=true;L.typed=true}
 if(L.typed){setMic(L.blocked?'blocked':'off',L.blocked?'Microphone blocked. Tap to allow, or type your answers.':'Speech recognition is unavailable here. Type your answers.')}
 return !L.typed}
async function micTap(a){const L=a.live;if(!L||L.stage!=='run')return;if(L.blocked){const ok=await ensureMic(a);if(ok)setStatus('Microphone allowed. I will listen from the next question.');return}if(L.finish)L.finish()}
// cb.session(text, confidences), cb.commit(), cb.fail()
function startRec(cb){
 if(native()){let on=true;
  window.testriqListenEvent=(type,text)=>{if(!on)return;
   if(type==='partial')cb.session(text);
   else if(type==='final'){cb.session(text);cb.commit()}
   else if(type==='rms')level(+text);
   else if(type==='end'||type==='error'){cb.commit();if(type==='error'&&(text==='9'||text==='unavailable')){on=false;cb.fail&&cb.fail();return}setTimeout(()=>{if(on)try{window.TestriqSpeech.listen()}catch{}},type==='error'?300:60)}};
  try{window.TestriqSpeech.listen()}catch{return null}
  return()=>{on=false;try{window.TestriqSpeech.stopListening()}catch{}}}
 if(WSR){let on=true,r=null;const go=()=>{if(!on)return;r=new WSR();r.lang='en-GB';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
   r.onresult=e=>{const res=Array.from(e.results);cb.session(res.map(x=>x[0].transcript).join(' '),res.filter(x=>x.isFinal&&x[0].confidence>0).map(x=>x[0].confidence))};
   r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){on=false;cb.fail&&cb.fail()}};
   r.onend=()=>{cb.commit();if(on)setTimeout(go,60)};try{r.start()}catch{}};
  go();return()=>{on=false;try{r&&(r.onend=null,r.abort())}catch{}}}
 return null}

/* ---------- examiner voice ---------- */
function examinerSay(a,text,opt={}){return new Promise(res=>{const av=$('#liveAv'),cap=$('#examinerCaption');if(av)av.classList.add('talk');
 let fin=false;const done=()=>{if(fin)return;fin=true;if(av)av.classList.remove('talk');res()};
 const showText=()=>{if(cap&&(spokenSubtitles()||opt.fallback)){cap.hidden=false;cap.textContent=text}};
 if(!state.voice||!state.volume){showText();setStatus(state.voice?'Volume is off. Increase it in Settings to hear the examiner.':'Examiner voice is off in Settings. The text is shown instead.');setTimeout(done,Math.min(9000,900+text.length*55));return}
 setStatus(opt.status||'Examiner speaking…');speak(text,r=>{if(r==='fail'){showText();setTimeout(done,Math.min(9000,900+text.length*55))}else done()});setTimeout(done,Math.max(15000,text.length*140))})}

/* ---------- running the interview ---------- */
async function beginLive(a){a.live={stage:'run',tok:(a.live.tok||0)+1,turns:plan(a),i:0,log:[],fu:{},fuN:0,mem:[],asked:new Set(),prefix:'',paused:false,typed:false,blocked:false};a.turns=[];a.response='';renderLive(a);setMic('off','Asking for microphone access…');setStatus('Allow the microphone when your phone asks.');await ensureMic(a);if(active!==a)return;
 a.live.pause=()=>{const L=a.live;L.paused=true;L.tok++;stopExaminerVoice();if(L.stopRec)L.stopRec();setMic('off','Paused')};
 a.live.resume=()=>{const L=a.live;L.paused=false;if(L.stage==='think')finishLive(a,++L.tok,true);else runFrom(a,L.i)};runFrom(a,0)}
async function runFrom(a,i){const L=a.live,tok=++L.tok;
 for(;i<L.turns.length;i++){const tr=L.turns[i];L.i=i;const prefix=L.prefix;L.prefix='';
  const res=await doTurn(a,tr,tok,i,prefix);if(!alive(a,tok))return;
  if(res.text&&tr.kind==='long'&&!L.mem.length){const k=keyPhrase(res.text);if(k)L.mem.push(k)}
  let asked=false;
  if(tr.follow&&res.text&&W(res.text).length>=2&&(L.fu[tr.part]||0)<(tr.part===2?2:1)){
   const ackText=ack(res.text,tr),qp=nextFollowUp(a,tr,res.text);setMic('off','');
   // Local follow-ups are instant. A connected AI gets a short head start; otherwise the examiner acknowledges while it thinks.
   let q=await Promise.race([qp,sleep(state.aiUrl?450:0).then(()=>undefined)]),pre=ackText;
   if(q===undefined){await examinerSay(a,ackText,{status:examinerFor(a.examinerId).name+' is thinking…'});if(!alive(a,tok))return;pre='';q=await qp}
   if(!alive(a,tok))return;
   if(q){L.fu[tr.part]=(L.fu[tr.part]||0)+1;asked=true;await doTurn(a,{part:tr.part,label:tr.label,kind:'qa',q,say:q,max:tr.max,isFu:true},tok,i,pre);if(!alive(a,tok))return}}
  const next=L.turns[i+1];
  if(!asked&&res.text&&tr.kind==='qa'&&!tr.id&&next&&!/^Thank you/.test(next.say)&&!L.prefix)L.prefix=ack(res.text,tr)}
 await finishLive(a,tok)}
const flip=s=>s.replace(/\bmyself\b/gi,'yourself').replace(/\bmy\b/gi,'your').replace(/\bme\b/gi,'you').replace(/\bi am\b/gi,'you are').replace(/\bi'm\b/gi,"you're").replace(/\bmine\b/gi,'yours').replace(/\bi\b/gi,'you').replace(/\bwe\b/gi,'you');
const cutAt=s=>s.split(/\b(because|but|so|which|when|since|and then|although|and|um|uh)\b/i)[0].replace(/[\s,]+$/,'').trim();
const tidy=s=>{const w=cutAt(s).split(/\s+/).filter(Boolean).slice(0,8);while(w.length&&/^(the|a|an|at|of|to|in|for|with|and|my|your|on|by|very|really|so)$/i.test(w[w.length-1]))w.pop();return w.join(' ')};
const BADOBJ=/^(it|that|this|them|him|her|to|most|best|about|when|how|what|which|being|doing|so|very|a lot|lots)\b/i;
const VERB=/\b(?:i|we)\s+(?:really\s+|also\s+|usually\s+|quite\s+|absolutely\s+)?(like|love|enjoy|prefer|hate|dislike|miss|admire|want|need)\s+([^.,;!?]{3,70})/i;
const NOTKEY=/^(usually|always|sometimes|often|really|actually|basically|probably|because|before|after|during|would|could|should|about|every|there|these|those|other|which|where|while|think|thing|things|something|someone|everything|people|really|maybe|quite|pretty|little|start|started|going|being|having|getting|doing|makes|lot|lots|time|times|today|yesterday|weekend|important)$/i;
const ADJ=/^(new|old|local|public|big|small|good|best|favourite|main|young|older|younger|modern|traditional|national|social|online|natural|cultural|historic|beautiful|busy|quiet|crowded|green|close|best)$|(al|ic|ive|ous|ful|less|able|ern|ese|ish)$/;
const nounish=w=>w&&w.length>=3&&!STOP.has(w)&&!NOTKEY.test(w)&&!/(ly|ing|ed)$/.test(w);
// Picks a topic noun phrase from the answer and keeps the right possessive: "my mother" -> "your mother".
function keyNoun(text){const t=String(text).toLowerCase().replace(/[^a-z' -]/g,' ');let m;const re=/\b(the|my|a|an|our|this|that|some)\s+([a-z]{3,})(?:\s+([a-z]{3,}))?/g,c={},ph={};
 while((m=re.exec(t))){const [,det,w1,w2]=m;let noun='',phrase='';if(w2&&ADJ.test(w1)&&nounish(w2)){noun=w2;phrase=w1+' '+w2}else if(nounish(w1)&&w1.length>=4){noun=w1;phrase=w1}if(!noun)continue;c[noun]=(c[noun]||0)+2;ph[noun]=(/^(my|our)$/.test(det)?'your ':'the ')+phrase}
 W(t).forEach(x=>{if(nounish(x)&&x.length>5)c[x]=(c[x]||0)+1});const best=Object.keys(c).sort((x,y)=>c[y]-c[x]||y.length-x.length)[0];return best?(ph[best]||best):''}
function keyPhrase(text){const t=String(text).replace(/\s+/g,' ');const m=VERB.exec(t);if(m){const o=tidy(m[2]);if(o&&!BADOBJ.test(o)&&!/\b(is|was|are|were)\b/i.test(o)&&W(o).length<=5)return flip(o)}return keyNoun(t)}
function ack(text,tr){const n=W(text).length;
 if(n<6)return rnd(['Okay.','I see.','Right.']);
 if(/\b(love|enjoy|favou?rite|amazing|great|wonderful|fantastic|happy|excited)\b/i.test(text))return rnd(['That sounds lovely.','I see. That sounds enjoyable.','How nice.']);
 if(/\b(difficult|hard|stress\w*|problem|worried|hate|bad|tired|sad)\b/i.test(text))return rnd(['I see, that sounds challenging.','I understand.']);
 if(n>45)return rnd(['Thank you, that is a detailed answer.','Interesting, thank you.']);
 return rnd(['Thank you.','I see, thank you.','Right, okay.','All right.'])}
/* Follow-ups that react to the candidate's own words, never repeat, and match the part of the test. */
function smartFollowUp(text,L,tr){const t=String(text).replace(/\s+/g,' ').trim(),n=W(t).length,part=tr?tr.part:0,used=L.asked||(L.asked=new Set());let m;
 const pick=list=>{const fresh=list.filter(q=>q&&!used.has(q));const q=fresh.length?rnd(fresh):null;if(q)used.add(q);return q};
 if(/\b(i don'?t know|not sure|no idea|never thought|i can'?t say|hard to say)\b/i.test(t)&&n<15)return pick(['That is fine. What do people you know think about it?','No problem. Can you think of an example from your own life?','That is okay. What would you guess, if you had to choose?']);
 if(n<8)return pick(['Could you tell me a little more about that?','Why is that?','Can you give me an example?']);
 if(part===2&&L.mem&&L.mem.length&&!L.memUsed&&Math.random()<.4){L.memUsed=1;return pick([`Earlier you talked about ${L.mem[0]}. How does that connect with what you have just said?`])}
 const out=[];
 if((m=VERB.exec(t))){const verb=m[1].toLowerCase(),o=tidy(m[2]);if(o&&o.length>2&&!BADOBJ.test(o)&&!/\b(is|was|are|were)\b/i.test(o)){const obj=flip(o);
   if(part===2){if(!/\byour\b/.test(obj))out.push(`Do you think most people ${verb} ${obj} too? Why, or why not?`,`Has the way people feel about ${obj} changed in recent years?`)}
   else if(/hate|dislike/.test(verb))out.push(`You said you ${verb} ${obj}. What exactly puts you off?`);else if(/want|need/.test(verb))out.push(`Why do you ${verb} ${obj}?`,`What would happen if you could not get ${obj}?`);else out.push(`What is it about ${obj} that you ${verb}?`,`When did you start to ${verb} ${obj}?`)}}
 if((m=/\b(?:i think|i believe|in my opinion|i feel)\s+(?:that\s+)?([^.,;!?]{8,80})/i.exec(t))){const c=flip(tidy(m[1]));if(W(c).length>=3)out.push(`Why do you think ${c}?`,`Would everyone agree that ${c}?`)}
 if((m=/\bbecause\s+([^.,;!?]{6,70})/i.exec(t)))out.push(`You said ${flip(tidy(m[1]))}. Can you give me a specific example of that?`);
 if((m=/\b(will|going to|plan to|want to|hope to|would like to)\s+([^.,;!?]{4,50})/i.exec(t))){const w=m[1].toLowerCase(),what=flip(tidy(m[2]));if(W(what).length>=2)out.push(`You mentioned that you ${w==='going to'?'are going to':w} ${what}. What might make that difficult?`)}
 if(/\b(last (year|week|month|summer)|when i was|years ago|yesterday|used to)\b/i.test(t))out.push('What was the most memorable part of that experience?','How did that experience change you?');
 if(/\b(every day|usually|often|sometimes|every week|always|never)\b/i.test(t))out.push(part===2?'Do you think this will change in the future?':'Has this changed over the years?');
 if((m=/\bmy (family|friends?|parents?|mother|father|brother|sister|teachers?|classmates?|colleagues?)\b/i.exec(t))){const who=m[1].toLowerCase();out.push(`How ${/s$/.test(who)?'have':'has'} your ${who} influenced you?`)}
 const kw=part===2?keyNoun(t):keyPhrase(t),kw2=/^your /.test(kw)?'':/^the \w+ \w+/.test(kw)?kw.replace(/^the /,''):kw;
 if(part===2){if(kw2)out.push(`What are the advantages and disadvantages of ${kw2} for society?`,`How might ${kw2} be different in twenty years?`,`What role should the government play when it comes to ${kw2}?`);out.push('Is this different for younger and older people?','Why do you think some people disagree with that view?')}
 else if(kw)out.push(`You mentioned ${kw}. Can you tell me more about that?`,`What makes ${kw} important to you?`);
 return pick(out)||pick([offlineFollowup(t,(L.fuN++)%4),'Could you explain that in a little more detail?','How do you feel about that now?'])}
async function nextFollowUp(a,tr,text){const L=a.live,local=()=>smartFollowUp(text,L,tr);if(!state.aiUrl)return local();
 try{const c=new AbortController(),tm=setTimeout(()=>c.abort(),4500),r=await fetch(state.aiUrl,{method:'POST',headers:{'Content-Type':'application/json'},signal:c.signal,credentials:'omit',body:JSON.stringify({action:'followup',exam:a.test.exam,examinerId:a.examinerId,nickname:state.nickname||state.name,part:tr.label,question:tr.q,messages:a.turns.slice(-12)})});clearTimeout(tm);if(r.ok){const d=await r.json();if(d&&typeof d.question==='string'&&d.question.trim()&&d.question.length<400){const q=d.question.trim();L.asked.add(q);a.lastSource='ai';return q}}}catch{}
 return local()}
function setPart(a,tr,i){const L=a.live;a.plannedIndex=tr.part;const p=$('#livePart');if(p)p.textContent=tr.label;const b=$('#liveBar');if(b)b.style.width=Math.round((i+1)/L.turns.length*100)+'%';
 const cue=$('#cueCard'),cap=$('#examinerCaption'),card=tr.kind==='long'||tr.kind==='read'||tr.kind==='rts';
 if(cue){if(card){cue.hidden=false;cue.innerHTML=`<b>${tr.kind==='long'?'Your topic':tr.kind==='rts'?'The situation':'Read this aloud'}</b><p>${esc(tr.q)}</p>`}else cue.hidden=true}
 if(cap){cap.textContent='';cap.hidden=card;if(tr.hint){cap.hidden=false;cap.textContent=tr.hint;cap.classList.add('hintcap')}else{cap.classList.remove('hintcap');if(!spokenSubtitles()&&tr.kind==='qa')cap.textContent=tr.q}}
 const lt=$('#liveText');if(lt)lt.textContent='';const tb=$('#typeBox');if(tb)tb.hidden=true;const qt=$('#qTimer');if(qt)qt.textContent=''}
async function doTurn(a,tr,tok,i,prefix){const L=a.live,out={text:'',sec:0};setPart(a,tr,i);

 ['Campus Life','Universities increasingly offer flexible study options, including evening classes and online modules. These choices allow students to balance their education with work and family responsibilities, although they also require strong time-management skills.',['The library will close early on Friday afternoon.','Please submit your assignment before the end of the week.','Most students prefer to study in small groups.'],'Today I want to talk about how students take notes. Research shows that students who write notes by hand often remember ideas better than those who type, because writing by hand forces them to summarise. Typing lets students record more words, but they may copy the lecture without thinking. The best approach may be to type when speed matters and to write by hand when deep understanding is the goal.',['notes','hand','remember','typing','summarise','understanding','speed'],[['What do we call a person who designs buildings?',['architect']],['How many days are there in a leap year?',['366','three hundred and sixty six','three hundred sixty six']],['What instrument do people use to look at distant stars?',['telescope']]],'You are in a study group. One member has not done their share of the work for two weeks, and the deadline is in three days. Tell them how you feel and suggest what the group should do.'],

<script id="core">
/* ============================================================

(function(){
'use strict';
const wordsOf=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
const short=t=>t.short||(t.title.includes(' · ')?t.title.split(' · ').slice(1).join(' · '):t.title);
window.tqShort=short;

/* ---------- Pacing: seconds per question, modelled on the real exams ----------
   IELTS Reading  60 min / 40 q  → 45 s per item + time to read the passage
   IELTS Listening 30 min / 40 q → 30 s per item; the clock pauses while audio plays
   SAT Math       70 min / 44 q  → 95 s per item
   SAT R&W        64 min / 54 q  → 60 s per item + passage reading time
   PTE Reading / Listening       → 60 s / 35 s per item
   Grammar & vocabulary drills   → 30 s per item                               */
const PACE={IELTS:{Grammar:30,Reading:45,Listening:30,Overall:45},SAT:{Math:95,English:60,Reading:60,'Reading & Writing':60,Overall:70},PTE:{Reading:60,Listening:35,Overall:50}};
const READ_WPM=170,AUDIO_WPM=150;
window.qSeconds=function(t,i){const q=t.questions[i];if(q.time)return q.time;const p=PACE[t.exam]||{};let s=p[q.section]||p[t.skill]||60;
 const pass=q.passage||t.passage||'',prev=i>0?(t.questions[i-1].passage||t.passage||''):'';
 if(pass&&(i===0||pass!==prev))s+=Math.round(wordsOf(pass)/READ_WPM*60);
 if(/Reorder paragraphs/.test(q.prompt))s+=30;
 return Math.max(15,Math.round(s/5)*5)};
window.totalSec=t=>t.questions.reduce((n,q,i)=>n+qSeconds(t,i),0);
window.paceLabel=t=>{if(!t.questions)return '';const p=PACE[t.exam]||{},base=p[t.skill]||60;return base+' s per question'+(t.passage?' + reading time':'')+(t.audioText?' · clock pauses during audio':'')};
function applyDurations(){
 tests.forEach(t=>{if(t.questions&&t.questions.length){let s=totalSec(t);if(t.audioText)s+=Math.round(wordsOf(t.audioText)/AUDIO_WPM*60);t.duration=Math.max(1,Math.round(s/60))}});
 tests.forEach(t=>{if(t.mode==='speaking'&&t.tasks)t.duration=Math.max(6,Math.round(t.tasks.reduce((n,k)=>n+({read:75,repeat:20,retell:95,asq:15,rts:70}[k.type]||40),0)/60))});
 tests.forEach(t=>{if(t.mode==='overall')t.duration=t.modules.reduce((n,id)=>{const m=tests.find(x=>x.id===id);return n+(m?m.duration:0)},0)})}
applyDurations();window.tqApplyDurations=applyDurations;

/* ---------- Sessions ---------- */
window.start=function(id,bundle=null){const test=tests.find(t=>t.id===id);if(!test)return;if(test.mode==='overall')return startOverall(test);
 cleanup();const d=state.drafts[id]||{},ex=examinerFor(d.examinerId||state.examinerId).id;
 active={test,examinerId:ex,index:d.index||0,answers:d.answers||{},locked:d.locked||{},qLeft:d.qLeft||{},spent:d.spent||{},seconds:d.seconds??test.duration*60,response:d.response||'',turns:d.turns||[{role:'assistant',content:test.prompt||'',examinerId:ex}],checks:d.checks||[],clips:d.clips||[],plannedIndex:d.plannedIndex||0,bundle,completed:false,busy:false};
 if(test.questions){active.index=Math.min(active.index,test.questions.length-1);for(let i=0;i<active.index;i++)if(active.answers[i]!==undefined||!active.locked[i])active.locked[i]=active.locked[i]||true}
 openPractice(test.title);showActive();clock=setInterval(tick,1000)};
window.draft=function(){const a=active;if(!a||a.completed||!a.test||a.test.mode==='overall')return;const {test,answers,index,seconds,response,turns,checks,clips,plannedIndex,examinerId,locked,qLeft,spent}=a;state.drafts[test.id]={answers,index,seconds,response,turns,checks,clips,plannedIndex,examinerId,locked,qLeft,spent,updated:Date.now()};save()};
window.addResult=function(r){const a=active;r.clips=a.clips||[];if(r.skill==='Speaking')r.examinerId=a.examinerId;const row={...r,id:Date.now(),date:new Date().toISOString(),testId:a.test.id};state.results.unshift(row);
 if(a.bundle){const b=a.bundle,p=state.drafts[b.id]||{done:{}};p.done=p.done||{};p.done[a.test.id]=row.id;state.drafts[b.id]=p}
 delete state.drafts[a.test.id];a.completed=true;save();clearInterval(clock);clock=null;stopRecognition();stopExaminerVoice();if(window.tqAfterResult)tqAfterResult(row)};
function tick(){const a=active;if(!a||a.completed)return;const t=a.test;if(t.questions)return qTick();
 a.seconds=Math.max(0,a.seconds-1);const el=$('#timer');if(el){el.textContent=fmt(a.seconds);el.classList.toggle('warn',a.seconds<=60)}
 if(state.ticks&&a.seconds>0&&a.seconds<=10&&t.mode!=='speaking')tone(1000,.04,.08);
 if(a.seconds===0&&!a.timeUpShown){a.timeUpShown=true;if(state.ticks)bell();notify(t.mode==='writing'?'Time is up. Finish your sentence, then submit for feedback.':'Suggested time is up. You can continue or finish.')}
 if(a.seconds%10===0)draft()}
window.topbar=function(){const a=active,t=a.test,quiz=!!t.questions,left=quiz?(a.qLeft[a.index]??qSeconds(t,a.index)):a.seconds;
 return `<div class="testtop"><span class="pill">${esc(t.exam)} · ${esc(t.skill)}</span><span class="timer ${quiz&&left<=10?'warn':''}" id="timer" title="${quiz?'Time left for this question':'Suggested time left'}">${quiz&&a.locked[a.index]?'✓':fmt(left)}</span></div>${quiz?`<div class="qclock" aria-hidden="true"><span id="qbar" style="width:${a.locked[a.index]?0:Math.round(left/qSeconds(t,a.index)*100)}%"></span></div><p class="qpaused" id="qpaused" hidden>⏸ Clock paused while the recording plays</p>`:''}`};

/* ---------- Per-question clock ---------- */
function paint(a){const t=a.test,i=a.index,left=a.qLeft[i],full=qSeconds(t,i),el=$('#timer'),bar=$('#qbar');if(el){el.textContent=fmt(left);el.classList.toggle('warn',left<=Math.max(5,Math.min(10,full*.25)))}if(bar){bar.style.width=Math.round(left/full*100)+'%';bar.classList.toggle('warn',left<=10)}}
// The clock always runs on the first unanswered question, even while an earlier one is being reviewed.
function frontier(a){const n=a.test.questions.length;for(let k=0;k<n;k++)if(!a.locked[k])return k;return -1}
function qTick(){const a=active,t=a.test,f=frontier(a);if(f<0)return;const viewing=a.index===f;
 const paused=!!(t.audioText&&examinerSpeech);const pz=$('#qpaused');if(pz)pz.hidden=!(paused&&viewing);if(paused)return;
 if(a.qLeft[f]==null)a.qLeft[f]=qSeconds(t,f);a.qLeft[f]=Math.max(0,a.qLeft[f]-1);if(viewing)paint(a);
 if(viewing&&state.ticks&&a.qLeft[f]>0&&a.qLeft[f]<=5)tone(1000,.04,.08);if(a.qLeft[f]%5===0)draft();
 if(a.qLeft[f]===0){if(state.ticks)bell();lock(a,f,true);if(!viewing){notify('Time ran out on question '+(f+1)+'.');return}
  if(state.examMode){showQuestion();setTimeout(()=>{if(active===a&&a.index===f)advance(a)},900)}else showQuestion()}}
function lock(a,i,timedOut){if(a.locked[i])return;const t=a.test,q=t.questions[i];a.locked[i]=timedOut?'time':true;const full=qSeconds(t,i);a.spent[i]=full-(a.qLeft[i]??full);if(!state.examMode&&(a.answers[i]!==undefined||timedOut))answerFeedback(a.answers[i]===q.answer);draft()}
function advance(a){const t=a.test;if(a.index<t.questions.length-1){a.index++;draft();showQuestion();$('#modalBody').scrollTop=0}else finishQuiz(false)}

/* ---------- Question screen ---------- */
const L='ABCDEFGH';
window.showQuestion=function(){const a=active,t=a.test,i=a.index,q=t.questions[i],n=t.questions.length;if(a.qLeft[i]==null&&!a.locked[i])a.qLeft[i]=qSeconds(t,i);
 const locked=!!a.locked[i],chosen=a.answers[i],reveal=locked&&!state.examMode,pass=q.passage||t.passage,ok=chosen===q.answer;
 const dots=t.questions.map((_,k)=>{const lk=a.locked[k],c=a.answers[k]===t.questions[k].answer;return `<span class="qdot ${k===i?'now':''} ${lk?(state.examMode?'seen':c?'ok':'no'):''}"></span>`}).join('');
 $('#modalBody').innerHTML=topbar()+`<div class="qhead"><span class="muted">Question ${i+1} of ${n}${q.section?' · '+esc(q.section):''}</span><span class="qdots" aria-hidden="true">${dots}</span></div>`+
 (pass?`<div class="passage">${esc(pass)}</div>`:'')+
 (t.audioText?`<div class="panel listenbox"><div class="testtop"><b>🎧 Recording</b><span class="muted">${t.exam==='IELTS'?'In the real test you hear it once':'Play, then answer'}</span></div><div class="actions"><button class="btn primary small" id="playPassage">▶ Play recording</button><button class="btn ghost small" id="stopVoice">■ Stop</button></div><p class="muted" style="margin:10px 0 0">The question clock pauses while the recording plays.</p><details style="margin-top:10px"><summary class="muted">Show transcript</summary><p class="muted">${esc(t.audioText)}</p></details></div>`:'')+
 `<div class="question qtext">${esc(q.prompt)}</div><div class="options">${q.options.map((o,k)=>`<button class="option ${chosen===k?'selected':''} ${reveal?(k===q.answer?'correct':chosen===k?'incorrect':''):''}" ${locked?'disabled':''} data-opt="${k}" aria-pressed="${chosen===k}"><span class="optkey">${L[k]}</span>${esc(o)}</button>`).join('')}</div>`+
 (reveal?`<div class="explain ${ok?'good':'bad'}"><b>${ok?'✓ Correct':chosen===undefined?'⏱ Time’s up':'✗ Not quite'}</b>${ok?'':`<p class="ans">Correct answer: <strong>${L[q.answer]} · ${esc(q.options[q.answer])}</strong></p>`}<p>${esc(q.explanation)}</p></div>`:locked&&state.examMode?`<p class="muted lockednote">${chosen===undefined?'⏱ Time ran out on this question.':'Answer locked. Results appear at the end.'}</p>`:'')+
 `<div class="qfoot"><button class="btn ghost" id="previous" ${i===0?'disabled':''}>← Previous</button><button class="btn primary" id="next">${locked?(i===n-1?'Finish & see results':'Next question →'):state.examMode?(i===n-1?'Submit answer & finish':'Submit & next →'):'Check answer'}</button></div><p class="muted" style="margin-top:14px">${state.examMode?'Exam mode: answers are revealed at the end.':'Practice mode: you see the answer after each question.'} Progress saves automatically.</p>`;
 $$('[data-opt]').forEach(b=>b.onclick=()=>{if(a.locked[i])return;a.answers[i]=Number(b.dataset.opt);if(t.skill==='Grammar'&&!state.examMode){lock(a,i,false)}draft();showQuestion()});
 $('#previous').onclick=()=>{if(i===0)return;a.index--;showQuestion()};
 $('#next').onclick=()=>{if(!a.locked[i]){if(a.answers[i]===undefined)return notify('Choose an answer first.');lock(a,i,false);if(state.examMode)return advance(a);return showQuestion()}advance(a)};
 if(t.audioText){$('#playPassage').onclick=()=>{speak(t.audioText,()=>{const pz=$('#qpaused');if(pz)pz.hidden=true});const pz=$('#qpaused');if(pz)pz.hidden=false};$('#stopVoice').onclick=()=>{stopExaminerVoice();const pz=$('#qpaused');if(pz)pz.hidden=true}}
 if(!locked&&a.qLeft[i]!=null)paint(a)};
document.addEventListener('keydown',e=>{const a=active;if(!a||a.completed||!a.test?.questions||!$('#practice').open||e.target.matches('input,textarea,select'))return;const k=e.key.toUpperCase(),i=L.indexOf(k),n=Number(e.key);const idx=i>=0&&i<4?i:n>=1&&n<=4?n-1:-1;if(idx>=0){const b=$(`[data-opt="${idx}"]`);if(b&&!b.disabled){b.click();e.preventDefault()}}else if(e.key==='Enter'&&$('#next')){$('#next').click();e.preventDefault()}});

window.finishQuiz=function(timeout){const a=active;if(!a||a.completed)return;const t=a.test,correct=t.questions.reduce((n,q,i)=>n+(a.answers[i]===q.answer),0);
 const alloc=t.questions.map((_,i)=>qSeconds(t,i)),spent=t.questions.map((_,i)=>a.spent[i]??alloc[i]);
 const r={exam:t.exam,skill:t.skill,title:t.title,mode:'quiz',questions:t.questions,answers:{...a.answers},correct,total:t.questions.length,percent:Math.round(correct/t.questions.length*100),timeout,alloc,spent,timedOut:t.questions.map((_,i)=>a.locked[i]==='time')};
 addResult(r);showReview(state.results[0])};

/* ---------- Score estimates (practice guides, not official conversions) ---------- */
const IELTS_L=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[11,4],[8,3.5],[6,3],[4,2.5],[0,2]];
const IELTS_R=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,2]];
window.tqBand=(skill,pct)=>{const raw=Math.round(pct/100*40);return (skill==='Listening'?IELTS_L:IELTS_R).find(([m])=>raw>=m)[1]};
window.tqIeltsRound=x=>{const f=Math.floor(x),d=x-f;return d<.25?f:d<.75?f+.5:f+1};
window.tqSat=pct=>Math.round((200+600*pct/100)/10)*10;
window.tqPte=pct=>Math.round(10+80*pct/100);
function estimateFor(r){if(!r)return null;
 if(r.mode==='quiz'){if(r.exam==='IELTS'&&(r.skill==='Listening'||r.skill==='Reading'))return {label:'≈ Band',value:tqBand(r.skill,r.percent).toFixed(1),num:tqBand(r.skill,r.percent)};
  if(r.exam==='PTE')return {label:'≈ Score',value:String(tqPte(r.percent)),num:tqPte(r.percent)};
  if(r.exam==='SAT'){const qs=r.questions||[];if(qs.some(x=>x.section)){const by={};qs.forEach((x,i)=>{const k=x.section;by[k]=by[k]||{c:0,n:0};by[k].n++;if(r.answers[i]===x.answer)by[k].c++});const tot=Object.values(by).reduce((n,v)=>n+tqSat(Math.round(v.c/v.n*100)),0);return {label:'≈ Total',value:String(tot),num:tot,outOf:1600}}return {label:'≈ Section',value:String(tqSat(r.percent)),num:tqSat(r.percent),outOf:800}}
  return {label:'Accuracy',value:r.percent+'%',num:r.percent}}
 const s=r.assessment;if(s&&s.overall!=null)return {label:s.scale===90?'≈ Score':'≈ Band',value:s.scale===90?String(Math.round(s.overall)):Number(s.overall).toFixed(1),num:Number(s.overall)};return null}
window.tqEstimate=estimateFor;

/* ---------- Review ---------- */
function fmtShort(s){s=Math.round(s||0);return s<60?s+' s':Math.floor(s/60)+' min '+(s%60?s%60+' s':'')}
function sectionBreakdown(r){const qs=r.questions||[];if(!qs.some(q=>q.section))return '';const by={};qs.forEach((q,i)=>{const k=q.section||'Other';by[k]=by[k]||{c:0,n:0};by[k].n++;if(r.answers[i]===q.answer)by[k].c++});
 const rows=Object.entries(by).map(([k,v])=>{const p=Math.round(v.c/v.n*100);return `<div class="setting"><div><b>${esc(k)}</b><small>${v.c} of ${v.n} correct · ${p}%</small></div>${r.exam==='SAT'?`<span class="pill">≈ ${tqSat(p)}</span>`:''}</div>`}).join('');
 const total=r.exam==='SAT'?Object.values(by).reduce((n,v)=>n+tqSat(Math.round(v.c/v.n*100)),0):null;
 return `<div class="panel" style="margin:16px 0"><h3>Section breakdown</h3>${rows}${total?`<p class="muted" style="margin-top:10px">Rough total ≈ ${total} / 1600. A guide from a short set, not College Board scaling.</p>`:''}</div>`}
function nextClassFor(testId){const t=tests.find(x=>x.id===testId);if(!t||!window.tqSectionOf)return null;const list=tqSectionOf(t);if(!list)return null;const i=list.findIndex(x=>x.id===testId);return list.slice(i+1).find(x=>!tqIsDone(x))||list[i+1]||null}
window.showReview=function(r){$('#dialogTitle').textContent='Session review';releaseAudioURLs();const est=estimateFor(r),body=$('#modalBody');let html=`<div class="testtop"><span class="pill">${esc(r.exam)} · ${esc(r.skill)}</span><span class="muted">${new Date(r.date).toLocaleDateString()}</span></div><h2 style="margin:12px 0 4px">${esc(r.title)}</h2>`;
 if(r.mode==='quiz'){const used=(r.spent||[]).reduce((n,s)=>n+s,0),avail=(r.alloc||[]).reduce((n,s)=>n+s,0),late=(r.timedOut||[]).filter(Boolean).length;
  html+=`<div class="scorehead"><div><div class="resultScore">${r.percent}%</div><p class="muted">${r.correct} of ${r.total} correct${late?` · ${late} ran out of time`:''}</p></div>${est&&est.label!=='Accuracy'?`<div class="esttile"><small>${est.label}</small><strong>${est.value}</strong><small>${r.exam==='IELTS'?'practice guide':r.exam==='PTE'?'out of 90 · guide':'out of '+(est.outOf||800)+' · guide'}</small></div>`:''}</div>`+
  (avail?`<div class="timeline"><div><b>${fmtShort(used)}</b><small>time used</small></div><div><b>${fmtShort(avail)}</b><small>time allowed</small></div><div><b>${fmtShort(used/(r.total||1))}</b><small>average per question</small></div></div>`:'')+sectionBreakdown(r)+
  (r.questions||[]).map((q,i)=>{const ok=r.answers[i]===q.answer;return `<div class="reviewitem ${ok?'rv-ok':'rv-no'}"><div class="rvhead"><b>${ok?'✓':'✗'} ${i+1}. ${esc(q.prompt.split('\n')[0])}</b>${r.spent?`<span class="muted">${fmtShort(r.spent[i])}${r.timedOut&&r.timedOut[i]?' ⏱':''}</span>`:''}</div><p>Your answer: ${esc(q.options[r.answers[i]]??'Not answered')}<br>Correct: ${esc(q.options[q.answer])}</p><p>${esc(q.explanation)}</p></div>`}).join('')}
 else if(r.mode==='overall')html+=window.mockSummaryHTML?mockSummaryHTML(r):`<div class="passage">${esc(r.response)}</div>`;
 else if(r.skill==='Writing')html+=window.writingReviewHTML?writingReviewHTML(r):`<div class="passage">${esc(r.response||'')}</div>`;
 else if(r.turns)html+=`<p class="muted">${esc(r.feedback||'')}</p><details class="report-limitations"><summary>Full conversation</summary>${r.turns.map(t=>`<div class="reviewitem"><b>${t.role==='user'?'You':esc(examinerFor(t.examinerId||r.examinerId).name)}${t.source==='ai'?' · connected AI':''}</b><p>${esc(t.content)}</p></div>`).join('')}</details>`;
 const nxt=!active?.bundle&&r.testId?nextClassFor(r.testId):null;
 html+=`<div class="reviewactions">${r.testId&&!active?.bundle?`<button class="btn ghost" id="reviewAgain">↻ Try again</button>`:''}${nxt?`<button class="btn ghost" id="reviewNext">Next: ${esc(short(nxt))} →</button>`:''}<button class="btn primary" id="reviewDone">Done</button></div>`;
 body.innerHTML=html;
 if(r.skill==='Speaking')mountSpeakingReview(r);
 if(r.sections?.length){$$('[data-secreview]').forEach(b=>b.onclick=()=>{const child=state.results.find(x=>x.id===Number(b.dataset.secreview));if(!child)return;showReview(child);const d=$('#reviewDone');d.textContent='← Back to mock summary';d.onclick=()=>showReview(r);const ag=$('#reviewAgain');if(ag)ag.remove();const nx=$('#reviewNext');if(nx)nx.remove()})}
 if(r.clips?.length&&r.skill==='Speaking'){const rec=document.createElement('div');rec.className='panel';rec.style.marginTop='14px';body.insertBefore(rec,$('.reviewactions'));showClips(r.clips,rec)}
 if($('#reviewAgain'))$('#reviewAgain').onclick=()=>start(r.testId);
 if($('#reviewNext'))$('#reviewNext').onclick=()=>start(nxt.id);
 const done=$('#reviewDone');if(active?.bundle){done.textContent='Continue mock test →';const b=active.bundle;done.onclick=()=>startOverall(b)}else done.onclick=()=>closePractice();
 body.scrollTop=0};

/* ---------- Mock tests ---------- */
const mockName=t=>t.exam==='SAT'?'Practice test':'Mock test';
window.startOverall=function(test){draft();cleanup();const progress=state.drafts[test.id]||{done:{}};if(!progress.done)progress.done={};state.drafts[test.id]=progress;save();
 active={test,completed:true};openPractice(test.title);const mods=test.modules.map(id=>tests.find(t=>t.id===id)).filter(Boolean),done=mods.filter(m=>progress.done[m.id]).length,next=mods.find(m=>!progress.done[m.id]);
 $('#modalBody').innerHTML=`<span class="pill">${esc(test.exam)} · ${mockName(test)}</span><h2 style="margin:14px 0 6px">${esc(test.title)}</h2><p class="muted">${esc(test.desc)} About ${test.duration} minutes in total. Your progress saves after each section, so you can take a break between sections.</p><div class="progress"><span style="width:${Math.round(done/mods.length*100)}%"></span></div><p class="muted">${done} of ${mods.length} sections completed</p>`+
 mods.map((t,k)=>{const d=progress.done[t.id],res=d&&state.results.find(r=>r.id===d),est=estimateFor(res);return `<div class="panel overall-module ${d?'mod-done':''}"><div class="testtop"><div><span class="tag">Section ${k+1} · ${esc(t.skill)}</span><h3 style="margin:7px 0">${esc(short(t))}</h3><small class="muted">${t.duration} min${t.questions?' · '+t.questions.length+' questions':''}</small></div><span class="pill">${d?(est?est.label+' '+est.value:'✓ DONE'):t===next?'UP NEXT':t.duration+' MIN'}</span></div><button class="btn ${d?'ghost':t===next?'primary':'ghost'} small" data-module="${t.id}">${d?'Redo section':state.drafts[t.id]?'Resume section':'Start section'} →</button></div>`}).join('')+
 `<div class="qfoot"><button class="btn ghost" id="overallClose">Save & close</button><button class="btn primary" id="overallFinish" ${done<mods.length?'disabled':''}>See my ${test.exam==='IELTS'?'band':'score'} →</button></div>`;
 $$('[data-module]').forEach(b=>b.onclick=()=>start(b.dataset.module,test));$('#overallClose').onclick=()=>closePractice();
 $('#overallFinish').onclick=()=>{if(mods.some(m=>!progress.done[m.id]))return;const sections=mods.map(m=>state.results.find(r=>r.id===progress.done[m.id])).filter(Boolean);
  const r={id:Date.now(),date:new Date().toISOString(),testId:test.id,exam:test.exam,skill:'Overall',title:test.title,mode:'overall',sections:sections.map(s=>s.id),response:sections.map(s=>s.skill+': '+s.title).join('\n')};
  r.summary=mockScores(test.exam,sections);state.results.unshift(r);delete state.drafts[test.id];save();active={test,completed:true};showReview(r);if(window.tqAfterResult)tqAfterResult(r)}};
function mockScores(exam,sections){const rows=sections.map(s=>{const e=estimateFor(s);return {id:s.id,skill:s.skill,title:s.title,est:e?e.num:null,label:e?e.value:'—',pct:s.percent??null}});
 const nums=rows.map(x=>x.est).filter(x=>x!=null);let overall=null,note='';
 if(exam==='IELTS'){const by={};rows.forEach(x=>{if(x.est!=null)by[x.skill]=x.est});const v=Object.values(by);if(v.length)overall=tqIeltsRound(v.reduce((a,b)=>a+b,0)/v.length);note=v.length<4?'Some skills had too little evidence for a band, so the overall uses the skills that were scored.':'Average of the four skill bands, rounded the way IELTS rounds overall scores.'}
 else if(exam==='PTE'){if(nums.length)overall=Math.round(nums.reduce((a,b)=>a+b,0)/nums.length);note='Average of the section estimates on the 10–90 scale.'}
 return {rows,overall,note}}
window.mockSummaryHTML=function(r){const s=r.summary||mockScores(r.exam,(r.sections||[]).map(id=>state.results.find(x=>x.id===id)).filter(Boolean)),ielts=r.exam==='IELTS';
 return `<div class="report-banner" style="margin:14px 0"><div><div class="eyebrow">${ielts?'Mock test result':'Mock test score'}</div><h2>${ielts?'Estimated overall band':'Estimated overall score'}</h2><p>${esc(s.note||'')}</p></div><div class="band-tile"><span>${ielts?'Overall band':'Overall'}</span><strong>${s.overall==null?'—':ielts?Number(s.overall).toFixed(1):s.overall}</strong><small>${ielts?'practice estimate / 9':'practice estimate / 90'}</small></div></div>`+
 `<div class="panel"><h3>Section results</h3>${s.rows.map(x=>`<div class="setting"><div><b>${esc(x.skill)}</b><small>${esc(x.title)}${x.pct!=null?' · '+x.pct+'% correct':''}</small></div><div class="actions" style="align-items:center"><span class="pill">${esc(x.label)}</span><button class="btn ghost small" data-secreview="${x.id}">Review</button></div></div>`).join('')}</div><p class="report-disclaimer">These compact sections are far shorter than the real exam, so treat estimates as a direction of travel rather than a prediction.</p>`};

/* ---------- History: Android back, practice dialog, quit confirmation ---------- */
const H={ignore:0,dialog:false,deep:false,home:false};window.TQH=H;
const hPush=()=>{try{history.pushState({tq:Date.now()},'');return true}catch{return false}};
window.tqHistoryBack=n=>{if(n<=0)return;H.ignore++;try{history.go(-n)}catch{H.ignore--}};
window.tqEnsureDeep=()=>{if(!H.deep&&hPush())H.deep=true};
const baseOpen=window.openPractice,baseClose=window.closePractice;
window.openPractice=function(title){const was=$('#practice').open;baseOpen(title);if(!was&&hPush())H.dialog=true};
window.closePractice=function(){const qc=$('#quitConfirm');if(qc)qc.hidden=true;const home=H.home;H.home=false;baseClose();let n=0;if(H.dialog){n++;H.dialog=false}if(home&&H.deep){n++;H.deep=false}tqHistoryBack(n);if(home&&window.tqGoHome)tqGoHome()};
function hasProgress(a){if(!a||a.completed)return false;if(a.live)return a.live.stage==='run'||a.live.stage==='think';if(a.test.questions)return Object.keys(a.answers||{}).length>0||a.index>0;return !!(a.response&&a.response.trim())||(a.turns||[]).length>1||(a.clips||[]).length>0}
window.requestExit=function(home){const d=$('#practice');if(!d||!d.open)return;const qc=$('#quitConfirm');if(qc&&!qc.hidden)return;H.home=home===true;const a=active;
 if(!hasProgress(a)){window.closePractice();return}if(a.live&&a.live.pause)a.live.pause();
 $('#quitT').textContent=a.live?'End the speaking test?':'Leave this session?';$('#quitConfirm p').textContent=a.live?'Your answers so far will not be scored.':'Your progress is saved. Reopen this class to continue where you stopped.';$('#quitYes').textContent=a.live?'End test':'Save & leave';qc.hidden=false;$('#quitNo').focus()};
$('#quitYes').onclick=()=>window.closePractice();
$('#quitNo').onclick=()=>{$('#quitConfirm').hidden=true;H.home=false;const a=active;if(a&&a.live&&a.live.paused)a.live.resume()};
$('#dialogHome').onclick=()=>window.requestExit(true);
$('#closeModal').onclick=()=>window.requestExit();
window.addEventListener('popstate',()=>{if(H.ignore>0){H.ignore--;return}
 if($('#practice').open){H.dialog=false;if(hPush())H.dialog=true;window.requestExit();return}
 if(H.deep){H.deep=false;if(window.tqPageUp)tqPageUp()}});
})();

</script>

const RULES=[

 [/\bone of the (?:main |most important |biggest |best |major |key )?(?!(?:people|children|men|women|data|media|best|most|main|first|last|same|following|biggest|largest|worst|greatest|few|many)\b)([a-z]+[^s\s])\b(?=\s+(?:is|was|that|which|for|in|of)\b)/gi,(m,a)=>m.replace(new RegExp(a+'$'),/[^aeiou]y$/.test(a)?a.slice(0,-1)+'ies':/(ch|sh|x)$/.test(a)?a+'es':a+'s'),'“One of the …” is followed by a plural noun.'],

const INFORMAL=/\b(gonna|wanna|kinda|u|ur|kids|stuff|okay|ok|lots of|a lot of|really|so many|thing|things|guys)\b/gi;
const CONTRACTION=/\b(don['’]t|can['’]t|won['’]t|isn['’]t|aren['’]t|doesn['’]t|didn['’]t|it['’]s|i['’]m|they['’]re|we['’]re|you['’]re|shouldn['’]t|wouldn['’]t|couldn['’]t)\b/gi;

/* ---------- Text helpers ---------- */
const words=t=>(String(t).toLowerCase().match(/[a-z][a-z'’-]*/g)||[]);
const sentencesOf=t=>String(t).replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>/[a-z]/i.test(s));
const parasOf=t=>{let p=String(t).split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);if(p.length<2)p=String(t).split(/\n/).map(s=>s.trim()).filter(Boolean);return p};

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const count=(text,list)=>list.reduce((n,p)=>n+((String(text).toLowerCase().match(new RegExp('\\b'+p.replace(/[-]/g,'[- ]?').replace(/ /g,'\\s+')+'\\b','g'))||[]).length),0);

function findIssues(text){const issues=[];

function matchCase(src,f){return /^[A-Z]/.test(src)?f.charAt(0).toUpperCase()+f.slice(1):f}
const STRUCT=[['passive voice',/\b(is|are|was|were|be|been|being)\s+(\w+ed|built|made|given|taken|seen|known|done|shown|written|spent|brought|found|held|paid|sold|taught)\b/i],['conditional',/\bif\b[^.!?]{3,80}\b(will|would|could|might)\b/i],['perfect tense',/\b(has|have|had)\s+(been|\w+ed|done|seen|made|gone|become|grown|taken|given|shown|risen|fallen)\b/i],['modal verbs',/\b(should|could|might|must|would|may)\b/i],['relative clause',/\b(who|which|whose|whom)\b/i],['comparatives',/\b(\w+er than|more \w+ than|less \w+ than|as \w+ as)\b/i],['participle / -ing clause',/(^|[.,;]\s*)(\w+ing)\b/im]];

/* ---------- Shared analysis ---------- */
function analyse(text,t){const W=words(text),n=W.length,S=sentencesOf(text),P=parasOf(text),prompt=String(t.prompt||'').toLowerCase();

 const freq={};content.forEach(w=>{if(!pw.has(stem(w)))freq[w]=(freq[w]||0)+1});const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,3),repeated=top.filter(([,c])=>c>=Math.max(4,n*.025)).map(([w])=>w);

const per100=(x,n)=>n?x/n*100:0;
const relevance=(text,prompt)=>{const generic=new Set('people believe others think discuss views opinion reasons examples write words least relevant knowledge experience support ideas extent agree disagree should would summarise information selecting reporting features comparisons where below shows chart graph table diagram number between include your response minutes judged develop position organise present supporting details control elements standard written english essay topic about plan revise answer advantages disadvantages outweigh development'.split(' ').map(stem));
 const key=[...new Set(words(prompt).filter(w=>w.length>=5&&!STOP.has(w)).map(stem))].filter(k=>!generic.has(k));if(!key.length)return 1;const es=new Set(words(text).map(stem));return key.filter(k=>es.has(k)).length/key.length};

// Calibrated on sample essays: MATTR(40) ≈ .80 for limited writers and ≈ .93 for capable ones; less-common-word ratio separates band 6 (~.3) from band 8 (~.7).
function lexical(A){const m=clamp((A.mattr-.8)/.13,0,1),r=clamp((A.rareRatio-.12)/.58,0,1);let s=4.2+m*1+r*2.6+Math.min(.6,A.colloc*.2)-Math.min(1.5,per100(A.spell,A.n)*.4)-(A.repeated.length?.4:0)-Math.min(.6,A.informal*.08);if(A.n<120)s=Math.min(s,6);return s}
function grammar(A){const e=per100(A.gram+A.spell*.3,A.n);let s=3.4+clamp(A.complex/.6,0,1)*1.5+clamp(A.structs.length/5,0,1)*1.6+(A.sd>=5?.4:0)+(A.mean>=12&&A.mean<=28?.4:A.mean>35?-.7:A.mean<9?-.4:0)+(e===0?1.2:e<=.5?.9:e<=1?.5:e<=2?0:e<=3?-.6:-1.4)-Math.min(1,A.mech*.2)-(A.endsOk?0:.3);if(A.n<120)s=Math.min(s,6);return s}

const band=x=>Math.round(clamp(x,1,8.4));
const halfDown=x=>{const f=Math.floor(x),d=x-f;return d<.25?f:d<.75?f+.5:f+1};// IELTS-style rounding to the nearest half band

function assessIELTS2(text,t){const A=analyse(text,t),p=A.prompt,needOpinion=/opinion|agree or disagree|to what extent|outweigh|do you think/.test(p),both=/discuss both/.test(p),advdis=/outweigh|advantages/.test(p),probsol=/what can be done|what effects|problems|solutions?|measures/.test(p);

 const opinion=/\b(in my (opinion|view)|i (strongly |firmly |personally |would )?(believe|think|feel|agree|disagree|argue)|from my (perspective|point of view)|personally,|my view is|i am convinced)\b/.test(lower);

function assessIELTS1(text,t){const A=analyse(text,t),c=t.chart||{},lower=text.toLowerCase(),proc=c.type==='process';
