-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "Each of the students _____ a locker.", "options": ["has", "have", "having", "are have"], "answer": 0, "explanation": "Each is singular and takes has."}, {"prompt": "The results of the experiment _____ encouraging.", "options": ["is", "being", "was being a", "are"], "answer": 3, "explanation": "Results is the plural subject."}, {"prompt": "“Consistent” means _____.", "options": ["rarely seen", "unfinished", "following the same pattern", "changing randomly"], "answer": 2, "explanation": "Consistent describes regularity or agreement."}, {"prompt": "The study provides strong _____ for the theory.", "options": ["evidences of", "evidence", "evident", "evidently"], "answer": 1, "explanation": "Evidence is an uncountable noun in this usage."}]}, {"id": "ielts-grammar-18", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 18 · Word formation", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "The instructions were explained _____.", "options": ["clear", "clarity", "clearness of", "clearly"], "answer": 3, "explanation": "An adverb modifies explained."}, {"prompt": "We need a more _____ solution.", "options": ["effectiveness", "effects", "effective", "effectively"], "answer": 2, "explanation": "An adjective modifies solution."}, {"prompt": "“Sustainable” describes something that _____.", "options": ["never needs planning", "can be maintained over time", "must end immediately", "uses every resource at once"], "answer": 1, "explanation": "Sustainable practices can continue over time."}, {"prompt": "The company aims to _____ waste.", "options": ["reduce", "reduction", "reduced of", "reductive"], "answer": 0, "explanation": "After to, use the base verb reduce."}]}, {"id": "ielts-grammar-19", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 19 · Academic vocabulary", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "The research _____ that sleep affects memory.", "options": ["suggesting", "have suggest", "suggests", "suggest"], "answer": 2, "explanation": "Research is singular and takes suggests."}, {"prompt": "There is _____ evidence to support the claim.", "options": ["many", "little", "few", "a few"], "answer": 1, "explanation": "Use little with uncountable evidence."}, {"prompt": "“Significant” means _____.", "options": ["important or notable", "unrelated", "invisible", "ordinary in every case"], "answer": 0, "explanation": "Significant describes importance or a notable effect."}, {"prompt": "The findings _____ an important issue.", "options": ["highly", "height", "higher", "highlight"], "answer": 3, "explanation": "Highlight means draw attention to."}]}, {"id": "ielts-grammar-20", "exam": "IELTS", "skill": "Grammar", "title": "Grammar & Vocabulary 20 · Mixed review", "desc": "Four-choice grammar and vocabulary practice with instant answer feedback.", "duration": 7, "questions": [{"prompt": "If she had left earlier, she _____ the train.", "options": ["has catch", "would have caught", "will catch", "would caught"], "answer": 1, "explanation": "Third conditional uses would have plus past participle."}, {"prompt": "By next June, I _____ the course.", "options": ["will have completed", "will completing", "have complete", "had completing"], "answer": 0, "explanation": "Future perfect describes completion before a future point."}, {"prompt": "“Mitigate” means _____.", "options": ["make permanent", "ignore entirely", "measure exactly", "make less severe"], "answer": 3, "explanation": "Mitigate means reduce severity or harmful effects."}, {"prompt": "The organisation aims to _____ awareness of recycling.", "options": ["arise", "arouse up", "raise", "rise"], "answer": 2, "explanation": "Raise awareness is the standard collocation."}]}];

function stats(){const rows=state.results.filter(r=>r.mode==='quiz'),total=rows.reduce((n,r)=>n+(r.total||0),0),correct=rows.reduce((n,r)=>n+(r.correct||0),0);const days=new Set(state.results.map(r=>new Date(r.date).toLocaleDateString()));let day=new Date(),streak=0;if(!days.has(day.toLocaleDateString()))day.setDate(day.getDate()-1);while(days.has(day.toLocaleDateString())){streak++;day.setDate(day.getDate()-1)}return {total,correct,accuracy:total?Math.round(correct/total*100)+'%':'—',streak}}

function home(){const s=stats();return `<div class="hero"><div class="eyebrow">Your preparation workspace</div><h1>Make every practice<br>session count<span style="color:#9ab4ff">.</span></h1><p>Welcome, ${esc(state.nickname||state.name)}. Build skills, understand your mistakes, and prepare with a clear plan for IELTS, SAT and PTE.</p><div class="actions"><button class="btn white" data-nav="tests">Explore practice →</button><button class="btn glass" data-nav="courses">View courses</button></div></div><div class="grid stats">${stat('Practice sessions',state.results.length,'Completed on this device')}${stat('Questions answered',s.total,'Auto-marked questions')}${stat('Average accuracy',s.accuracy,'Sample questions only')}${stat('Study streak',s.streak+(s.streak===1?' day':' days'),'Based on local activity')}</div><div class="sectiontitle"><h2>Choose your exam</h2><button class="textbtn" data-nav="courses">All courses →</button></div><div class="grid examgrid">${courses()}</div><div class="grid twocol"><div class="panel"><div class="testtop"><h3>Meet your speaking companion</h3><span class="pill">2 EXAMINERS</span></div><p>A calm voice, a question at a time. Practise aloud, review your transcript and build confidence with follow-up questions.</p><button class="btn primary small" data-start="ielts-speaking-01">Choose an examiner →</button></div><div class="panel"><h3>Today’s study nudge</h3><div style="font-size:1.6rem">✧</div><b style="font-size:.85rem">Review before you repeat.</b><p>Understanding one mistake can be more useful than rushing through another set.</p><button class="btn ghost small" data-nav="review">Open my results →</button></div></div>`}

function settings(){return heading('Make Testriq yours','Settings','A little comfort goes a long way.')+`<div class="grid settingsgrid"><div class="panel"><h3>Appearance & accessibility</h3><div class="setting"><div><b>Theme</b><small>Choose your preferred appearance</small></div><select id="themeSelect" aria-label="Theme"><option value="light" ${state.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option></select></div>${switchRow('motion','Reduce motion','Limit animations, including the opening screen')}${switchRow('large','Larger text','Increase reading size')}<div class="setting"><div><b>Daily goal</b><small>Questions you aim to practise</small></div><select id="goal" aria-label="Daily question goal">${[5,10,15,20,30].map(n=>`<option ${Number(state.goal)===n?'selected':''}>${n}</option>`).join('')}</select></div><p class="muted">Today: ${state.results.filter(r=>r.mode==='quiz'&&new Date(r.date).toLocaleDateString()===new Date().toLocaleDateString()).reduce((n,r)=>n+r.total,0)} / ${state.goal} questions</p></div><div class="panel"><h3>Sound & voice</h3>${switchRow('music','Ambient sound','A gentle synthesized background tone. Pauses during practice and when the app is hidden.')}${switchRow('ticks','Timer sounds','Ticks in the final ten seconds and a completion bell')}${switchRow('voice','Examiner voice','Read listening passages and speaking questions aloud')}<div class="setting"><b>Volume</b><input id="volume" type="range" min="0" max="100" value="${state.volume}" aria-label="Sound volume"></div><button id="testSound" class="btn ghost small">Test timer bell</button></div><div class="panel"><h3>Permissions</h3><p>Manage the access Testriq uses. Your browser makes the final permission decision.</p><div id="permissions"></div><button class="btn ghost small" id="refreshPermissions">Refresh status</button></div><div class="panel"><h3>Speaking AI connection</h3><p>Connect an audio-capable AI service for speaking band estimates, criterion feedback and a personal practice plan. Without it, local reviews and offline follow-ups still work.</p><label class="field">AI endpoint (HTTPS)<input id="aiUrl" type="url" value="${esc(state.aiUrl)}" placeholder="https://your-worker.workers.dev"></label><p class="muted">Follow-ups share submitted transcripts. Audio assessment shares recordings only after you agree in the review screen. Use a trusted endpoint; API keys belong on its server.</p><button class="btn primary small" id="saveAI">Save connection</button><details class="ai-setup"><summary>How to enable audio assessment</summary><ol><li>Deploy the supplied Testriq AI Worker to your Cloudflare account.</li><li>Add your OpenAI API key as the Worker’s OPENAI_API_KEY secret. The service needs access to an audio-capable model.</li><li>Set APP_ORIGIN to this app’s address and keep its rate limiter enabled.</li><li>Paste the deployed HTTPS Worker URL above and save.</li><li>Record a speaking answer, finish the session, then agree to send it and choose Analyze recordings.</li></ol><p>The included AI_SETUP.md has the commands. Never paste an API key into this app.</p></details><p id="aiStatus" class="muted" role="status">${state.aiUrl?'Endpoint configured; connection not yet verified.':'Offline practice mode'}</p></div><div class="panel"><h3>Data & privacy</h3><p>Profile, drafts and results stay in this browser. Browser speech recognition may send audio to its provider. Recordings are saved locally on this device, with playback and download. Data export contains text and settings; download each audio recording separately.</p><div class="actions"><button class="btn ghost small" id="exportData">Export my data</button><button class="btn ghost small" id="resetData">Reset local data</button></div></div><div class="panel"><h3>About Testriq</h3><p>A learning product by SYMETREE.</p><p>Gmail: <a href="mailto:adibbhuiyan019@gmail.com">adibbhuiyan019@gmail.com</a><br>Gmail: <a href="mailto:symetree4@gmail.com">symetree4@gmail.com</a></p><b style="font-size:.82rem">Developer: Md Sajid Shahriar Bhuiyan</b><p style="margin-top:12px"><b style="font-size:.82rem">Gmail:</b> <a href="mailto:adibbhuiyan019@gmail.com">adibbhuiyan019@gmail.com</a><br><b style="font-size:.82rem">Gmail:</b> <a href="mailto:symetree4@gmail.com">symetree4@gmail.com</a></p><p style="margin-top:12px">Independent practice platform. Not affiliated with IELTS, College Board or Pearson.</p></div></div>`}
function library(){const rows=visibleTests().filter(t=>(exam==='All'||t.exam===exam)&&(skill==='All'||t.skill===skill));return heading('Practice centre','Practice tests','Short, focused sessions. Make room for progress.','<span class="pill">'+visibleTests().length+' PRACTICE ACTIVITIES</span>')+`<div class="filters">${['All','IELTS','SAT','PTE'].map(e=>`<button class="chip ${exam===e?'active':''}" data-exam="${e}">${e==='All'?'All exams':e}</button>`).join('')}</div><div class="filters">${['All','Reading','Listening','Writing','Speaking','Math','English','Grammar','Overall'].map(s=>`<button class="chip ${skill===s?'active':''}" data-skill="${s}">${s==='All'?'All skills':s}</button>`).join('')}</div><div class="grid testgrid">${rows.length?rows.map(t=>`<article class="testcard"><div class="testtop"><span class="tag">${t.exam} · ${t.skill}</span><span class="pill">${t.mode==='overall'?'4 SKILLS':t.skill==='Overall'?'COMBINED':'PRACTICE'}</span></div><h3>${t.title}</h3><p>${t.desc}</p><div class="testmeta">◷ ${t.duration} min &nbsp; · &nbsp; ${t.questions?t.questions.length+' questions':t.mode==='speaking'?'Voice recording':t.mode==='overall'?'4 skill sections':'Self-review'}</div><button class="btn primary" data-start="${t.id}">${state.drafts[t.id]?'Resume practice':'Start practice'} →</button></article>`).join(''):'<div class="empty">No sets match. Try a different exam or skill.</div>'}</div>`}
function results(){return heading('Learn from every attempt','My results','Your practice history, saved on this device.')+(state.results.length?state.results.map((r,i)=>`<article class="panel" style="margin-bottom:12px"><div class="testtop"><div><span class="tag">${esc(r.exam)} · ${esc(r.skill)}</span><h3 style="margin:6px 0">${esc(r.title)}</h3><small class="muted">${new Date(r.date).toLocaleString()}</small></div><span class="pill">${r.mode==='quiz'?r.correct+'/'+r.total+' correct':r.assessment?.overall!=null?'Speaking estimate '+r.assessment.overall.toFixed(1):r.skill==='Speaking'?'Speaking review':'Self-review'}</span></div>${r.mode==='quiz'?`<div class="progress"><span style="width:${r.percent}%"></span></div>`:'<p>No official score is generated for this practice.</p>'}<button class="btn ghost small" data-result="${i}">View review →</button></article>`).join(''):'<div class="empty">Your completed practice sessions will appear here.</div>')}
function progress(){const s=stats(),rows=state.results.filter(r=>r.mode==='quiz');return heading('Your learning signals','Progress','Choose what to practise next.')+`<div class="grid stats">${tracks.map(t=>stat(t.exam+' sessions',state.results.filter(r=>r.exam===t.exam).length,'Completed activities')).join('')}${stat('Best accuracy',rows.length?Math.max(...rows.map(r=>r.percent))+'%':'—','Auto-marked samples')}</div><div class="panel"><h3>Skill overview</h3>${['Reading','Listening','Writing','Speaking','Math','Grammar'].map(skill=>{const rs=rows.filter(r=>r.skill===skill),n=rs.reduce((a,r)=>a+r.total,0),c=rs.reduce((a,r)=>a+r.correct,0);return `<div class="setting"><b>${skill}</b><small>${n?Math.round(c/n*100)+'% · '+n+' questions':state.results.some(r=>r.skill===skill)?'Self-review activities completed':'Not attempted'}</small></div>`}).join('')}</div><div class="panel" style="margin-top:16px"><h3>Understanding these scores</h3><p>Accuracy measures sample questions only. It is not an official IELTS band, SAT scaled score or PTE score. Writing is self-reviewed. Connected audio AI can provide an estimated IELTS speaking band, with criterion feedback and uncertainty. Estimates are not validated predictions or official exam scores.</p></div>`}
function render(){const views={home,courses:()=>heading('Learning paths','Courses','Structured practice by exam and skill.')+`<div class="grid examgrid">${courses()}</div><div class="panel" style="margin-top:18px"><h3>A growing practice library</h3><p>Choose from ${visibleTests().length} activities, including 10 IELTS four-skill sets and 10 combined SAT sets. Combined IELTS sets use the linked skill activities. These are compact practice sets, not full-length official mocks. Listening uses browser-generated speech.</p></div>`,tests:library,review:results,progress,profile,settings,help:()=>heading('A few useful details','Help & about','Make yourself at home.')+`<div class="panel"><h3>Your first session</h3><p>Choose an exam, open an activity, and work through it at your own pace. Quiz answers and writing drafts save as you go. Close a session and reopen the same set to resume.</p><h3>Voice practice</h3><p>Adib uses browser text-to-speech. Press “Hear question” or “Play passage” to start. Record answer captures audio for local playback and download over HTTPS. Speech-to-text is an optional separate feature; you can always type a transcript. Stop recording before submitting an answer.</p><h3>Sound & permissions</h3><p>Ambient audio needs a tap to begin. It pauses during tests and when the app is hidden. The gallery uses your device’s file picker. Microphone and notification access can be requested individually in Settings; denied permissions can be changed in browser settings.</p><h3>AI and scoring</h3><p>Offline follow-ups use templates based on words in your answer. Connecting an AI endpoint enables model-generated follow-ups. Feedback is for practice, not an official score. No API key is embedded in this app.</p><h3>Install & offline</h3><p>When served over HTTPS, supported browsers offer Install app or Add to Home Screen. Open once online to cache the app. Speech recognition and connected AI can still require internet.</p><h3>About</h3><p>TESTRIQ · BY SYMETREE<br>Designed and developed by Md Sajid Shahriar Bhuiyan.</p></div>`};$('#main').innerHTML=(views[page]||home)()+`<footer>TESTRIQ · A SYMETREE learning product<br>Designed and developed by Md Sajid Shahriar Bhuiyan</footer>`;$('#desktopNav').innerHTML=navItems.map(navButton).join('');$('#mobileNav').innerHTML=navItems.filter(n=>['home','tests','review','profile','settings'].includes(n[0])).map(navButton).join('');bindPage();if(page==='settings')renderPermissions()}
function bindPage(){if(page==='profile'){ $('#choosePhoto').onclick=()=>$('#photoFile').click();$('#photoFile').onchange=pickPhoto;$('#removePhoto').onclick=()=>{state.photo='';save();apply();render()};$('#profileForm').onsubmit=e=>{e.preventDefault();const name=$('#userName').value.trim();if(!name)return notify('Enter a user name.');state.name=name;state.nickname=$('#nickname').value.trim();save();apply();render();notify('Profile saved.')};}if(page==='settings'){ $('#themeSelect').onchange=e=>{state.theme=e.target.value;save();apply()};$('#goal').onchange=e=>{state.goal=Number(e.target.value);save();render()};$('#volume').oninput=e=>{state.volume=Number(e.target.value);save();updateAudio()};$('#testSound').onclick=()=>bell();$('#refreshPermissions').onclick=renderPermissions;$('#saveAI').onclick=()=>{const value=$('#aiUrl').value.trim();try{if(value){const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password)throw Error();}state.aiUrl=value;save();$('#aiStatus').textContent=value?'Endpoint configured. It will be checked on your next speaking response.':'Offline practice mode';notify('AI connection saved.')}catch{notify('Enter a valid HTTPS endpoint without credentials.')}};$('#exportData').onclick=exportData;$('#resetData').onclick=()=>{if(confirm('Delete this browser’s Testriq profile, drafts and results?')){state={...defaults,results:[],drafts:{}};localStorage.removeItem('testriq_v1');clipStore('clear').catch(()=>notify('Audio storage could not be cleared. Clear site data in browser settings.'));save();apply();render();notify('Local data reset.')}}}}
async function pickPhoto(e){const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return notify('Choose an image file.');if(file.size>15*1024*1024)return notify('Choose an image smaller than 15 MB.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=canvas.height=320;const ctx=canvas.getContext('2d'),side=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-side)/2,(img.height-side)*.22,side,side,0,0,320,320);const previous=state.photo;state.photo=canvas.toDataURL('image/jpeg',.85);if(!save())state.photo=previous;apply();render()}catch{notify('This image could not be opened. Try a JPEG or PNG.')}finally{URL.revokeObjectURL(url)}}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='testriq-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
let audioCtx=null,musicGain=null,oscillators=[];
function audio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx){audioCtx=new AC();musicGain=audioCtx.createGain();musicGain.gain.value=0;musicGain.connect(audioCtx.destination);[130.81,196,261.63].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.value=i===0?.15:.07;o.connect(g);g.connect(musicGain);o.start();oscillators.push(o)})}audioCtx.resume().catch(()=>{});return audioCtx}
function updateAudio(){if(!audioCtx)return;musicGain.gain.setTargetAtTime(state.music&&!active&&!document.hidden?state.volume/100*.25:0,audioCtx.currentTime,.3)}
function tone(freq,duration,level=.2){const ctx=audio();if(!ctx||!state.volume||document.hidden)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(Math.max(.0001,level*state.volume/100),ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+duration)}function bell(){tone(660,.6);setTimeout(()=>tone(880,.8),160)}

function improvements(m,n){const im=[];if(m.avg<25)im.push({issue:'Answers are short',evidence:`Your answers averaged ${m.avg} words.`,action:'Aim for three or four sentences: answer, reason, example, then link back.'});
 if(m.fill>2)im.push({issue:'Filler words',evidence:`${m.fill} filler words were recognised.`,action:'Pause silently for a moment instead of saying um or you know.'});
 if(m.rep.length)im.push({issue:'Repeated words',evidence:`You repeated: ${m.rep.join(', ')}.`,action:'Prepare two or three synonyms for these words.'});
 if(m.conn<Math.max(2,n/60))im.push({issue:'Few linking phrases',evidence:`${m.conn} linking phrases in ${n} words.`,action:'Practise however, as a result, on the other hand and for example.'});
 if(!m.past||!m.fut)im.push({issue:'Limited tense variety',evidence:'Few past or future forms were heard.',action:'Answer with a short past story and a future plan on the same topic.'});
 if(!im.length)im.push({issue:'Precision',evidence:'Your answers were fluent.',action:'Replace general words with precise, topic-specific vocabulary.'});return im}
function analyse(a){const L=a.live,ielts=a.test.exam==='IELTS',ans=L.log.filter(x=>x.text&&!x.tr.id&&x.tr.kind!=='read'),text=ans.map(x=>x.text).join(' '),w=W(text),n=w.length,fb=[];let assessment;
 const rd=L.log.find(x=>x.tr.kind==='read');if(rd){const r=readAcc(rd.tr.q,rd.text);fb.push(r?`Read-aloud accuracy: ${r.pct}%${r.missed.length?'. Missing or misread words: '+r.missed.join(', ')+'.':'.'}`:'No read-aloud answer was captured.')}
 if(ielts&&n>=40){const s=score(ans,w,n,text),m=s.m;
  assessment={local:true,overall:s.overall,summary:`Estimated from the ${n} words recognised in your answers. It cannot judge pronunciation, so treat it as practice guidance, not an official IELTS band.`,confidence:'low',sufficientEvidence:true,created:new Date().toISOString(),criteria:[
  {key:'fluency',score:s.fl,observation:`Your answers averaged ${m.avg} words with ${m.conn} linking phrase${m.conn===1?'':'s'}${m.fill?' and '+m.fill+' filler word'+(m.fill===1?'':'s'):''}${m.wpm?', at about '+m.wpm+' words per minute':''}.`,practice:m.avg<25?'Extend each answer to three or four sentences: answer, reason, example.':m.fill>2?'Pause silently instead of using filler words.':'Use linking phrases such as however, as a result and for example.'},
  {key:'vocabulary',score:s.lx,observation:`You used ${m.u} different words out of ${m.n}${m.rep.length?'. Repeated often: '+m.rep.join(', ')+'.':'.'}`,practice:m.rep.length?'Replace repeated words with precise alternatives.':'Add topic vocabulary and a few less common phrases.'},
  {key:'grammar',score:s.gr,observation:`${m.cx} complex-clause marker${m.cx===1?'':'s'}. Tenses heard: ${[m.past&&'past',m.fut&&'future',m.perf&&'perfect',(!m.past&&!m.fut&&!m.perf)&&'mostly present'].filter(Boolean).join(', ')}.`,practice:'Mix simple and complex sentences, and use past, present and future forms where they fit.'},
  {key:'pronunciation',score:null,observation:'Pronunciation needs audio assessment, which this offline estimate cannot do.',practice:'Record yourself and compare your sounds and stress with the examiner.'}],
  strengths:strengths(m),improvements:improvements(m,n).slice(0,3),
  plan:[{day:'Day 1',task:'Answer the same questions aloud again, aiming for longer, structured answers.'},{day:'Day 2',task:'Record yourself, listen back and mark pauses and repeated words.'},{day:'Day 3',task:'Take another speaking test and compare your band estimate.'}],
  limitations:['This estimate uses the words your phone recognised, so recognition mistakes can lower it.','Pronunciation and intonation are not assessed.','It is practice guidance, not an official IELTS result.'],transcript:text};
  fb.push(`Estimated speaking band ${s.overall.toFixed(1)} / 9 from fluency, vocabulary and grammar. It is a practice estimate, not an official score.`)}
 else if(ielts)fb.push('Not enough speech was captured to estimate a band. Answer in longer sentences and speak clearly.');
 fb.push('Review each question, support your ideas with examples and keep your answers flowing.');
 return{feedback:fb.join(' '),assessment}}
async function finishLive(a,tok){const L=a.live;setMic('off','');setStatus('');await examinerSay(a,'Thank you. That is the end of the speaking test.');if(active!==a||L.tok!==tok)return;
 const r=analyse(a);L.stage='done';addResult({exam:a.test.exam,skill:'Speaking',title:a.test.title,mode:'self',turns:[...a.turns],response:'',feedback:r.feedback,assessment:r.assessment});showReview(state.results[0])}
window.TQLIVE={plan,score,analyse,readAcc};

/* ---------- full screen, back button and quit confirmation ---------- */
let pushed=false,ignore=false;
const pushHist=()=>{if(pushed)return;try{history.pushState({tq:1},'');pushed=true}catch{}};
const popHist=()=>{if(!pushed)return;pushed=false;ignore=true;try{history.back()}catch{ignore=false}};
const _open=window.openPractice,_close=window.closePractice;
window.openPractice=function(t){const was=$('#practice').open;_open(t);if(!was)pushHist()};
window.closePractice=function(){const q=$('#quitConfirm');if(q)q.hidden=true;_close();popHist()};
window.requestExit=function(){const d=$('#practice');if(!d||!d.open)return;const q=$('#quitConfirm');if(q&&!q.hidden)return;const a=active;
 if(!a||a.completed||(a.live&&a.live.stage==='lobby')){window.closePractice();return}
 if(a.live&&a.live.pause)a.live.pause();q.hidden=false;$('#quitNo').focus()};
$('#quitYes').onclick=()=>window.closePractice();
$('#quitNo').onclick=()=>{$('#quitConfirm').hidden=true;const a=active;if(a&&a.live&&a.live.paused)a.live.resume()};
window.addEventListener('popstate',()=>{if(ignore){ignore=false;return}if($('#practice')&&$('#practice').open){pushed=false;pushHist();window.requestExit()}});
})();
</script>
